name: Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: ubuntu-latest
          # Linux ARM64
          - os: ubuntu-22.04-arm
          # macOS Arm
          - os: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'

      - name: Run tests (Unix)
        run: go test -v -tags=integration ./...

      - name: Check workflow and provider races
        run: go test -race ./pkg/workflow ./pkg/jobdb/secrets/... ./pkg/jobdb/cli ./examples/secret-provider

  # Summary job that depends on all matrix jobs completing
  test-summary:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test platform to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Test matrix did not pass: $TEST_RESULT"
            exit 1
          fi
          echo "All test matrix jobs completed successfully"

  release:
    needs: [test-summary]
    if: github.event_name == 'push' && needs.test-summary.result == 'success'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yaml
    secrets: inherit
