        clientPayload:
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        clientPayloadRevision:
          type: string
          pattern: '^[0-9]+$'
        executionState:
          allOf:
            - $ref: '#/components/schemas/ExecutionState'
        jobKey:
          $ref: '#/components/schemas/ProjectJobKey'
        status:
          $ref: '#/components/schemas/JobStatus'
        jobType:
          type: string
        nextRoute:
          $ref: '#/components/schemas/Route'
        waitFor:
          type: array
          items:
            type: string
        availableAt:
          type: string
          format: date-time
        expiresAt:
          x-go-type: time.Time
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        leaseExpiresAt:
          x-go-type: time.Time
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        lastLeaseUpdatedAt:
          type: string
          format: date-time
          description: Occurrence time of the most recent successful lease acquisition or renewal, when known.
        cancelRequested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        archivedAt:
          x-go-type: time.Time
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        metadata:
          $ref: '#/components/schemas/Metadata'
        schemaHash:
          $ref: '#/components/schemas/JobSchemaHash'
        parentJobId:
          type: string
        cell:
          $ref: '#/components/schemas/CellName'
        cellRepo:
          $ref: '#/components/schemas/CellRepo'
        cellId:
          $ref: '#/components/schemas/CellId'
    ProjectKeepAliveLeaseResponse:
      type: object
      additionalProperties: false
      required: [leaseToken]
      properties:
        lease:
          $ref: '#/components/schemas/ProjectExecutionLease'
          description: Authoritative renewed snapshot; absent on servers without supplied-lease support.
        leaseToken:
          type: string
    ProjectLeaseEvent:
      type: object
      additionalProperties: false
      description: Immutable scheduler snapshot. Acquisitions require acquisitionSource and omit previousLeaseExpiresAt; renewals require previousLeaseExpiresAt and omit acquisitionSource and previousLeaseId. Tokens and credentials are never returned. Renewal can shorten expiry.
      required: [eventId, eventType, occurredAt, jobKey, cell, cellId, cellRepo, goalId, jobType, route, leaseId, workerId, leaseExpiresAt]
      properties:
        eventId: {type: string}
        eventType: {$ref: '#/components/schemas/LeaseEventType'}
        occurredAt: {type: string, format: date-time}
        jobKey: {$ref: '#/components/schemas/ProjectJobKey'}
        cell: {type: string}
        cellId: {type: string}
        cellRepo: {type: string}
        goalId: {type: string}
        jobType: {type: string}
        route: {$ref: '#/components/schemas/Route'}
        leaseId: {type: string}
        workerId: {type: string}
        leaseExpiresAt: {type: string, format: date-time}
        previousLeaseExpiresAt: {type: string, format: date-time}
        acquisitionSource: {$ref: '#/components/schemas/LeaseAcquisitionSource'}
        previousLeaseId: {type: string}
    ProjectListCellsResponse:
      type: object
      additionalProperties: false
      required:
        - cells
      properties:
        cells:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProjectCell'
        nextPageToken:
          type: string
          minLength: 1
          description: Omitted on the last page; never null or an empty string.
    ProjectListDependencyWaitsResponse:
      type: object
      properties:
        waits: {type: array, items: {$ref: '#/components/schemas/ProjectDependencyWaitInfo'}}
        nextPageToken: {type: string}
    ProjectListGoalsResponse:
      type: object
      properties:
        goals: {type: array, items: {$ref: '#/components/schemas/ProjectGoalSummary'}}
        nextPageToken: {type: string}
    ProjectListJobSchemasResponse:
      type: object
      required: [schemas]
      additionalProperties: false
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/ProjectJobSchemaInfo'
    ProjectListJobsRequest:
      type: object
      additionalProperties: false
      properties:
        appendKeys:
          type: array
          items:
            type: string
        goalIds:
          type: array
          items: {type: string}
        includeHidden:
          type: boolean
          default: false
          description: Include jobs hidden by deleteJobs, for direct history lookup or inspection. Does not make them runnable again.
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/JobStatus'
        stores:
          type: array
          items:
            $ref: '#/components/schemas/JobStore'
        jobTypes:
          type: array
          items:
            type: string
        jobTasks:
          type: array
          items:
            $ref: '#/components/schemas/JobTaskFilter'
        availableRoutes:
          type: array
          description: |
            Return only jobs currently leaseable through one of these routes,
            using the same eligibility and due-alternate rules as pollWork.
            Omitted or empty disables this filter. Intersects all other filters
            before pagination. Read-only: does not acquire a lease or change
            nextRoute, which remains the stored route. Acquire with the same
            supported routes; availability can change after listing.
          items:
            $ref: '#/components/schemas/Route'
        jobKeys:
          type: array
          items:
            $ref: '#/components/schemas/ProjectJobKey'
        parentJobIds:
          type: array
          description: Direct parent job IDs whose children should be returned.
          items:
            type: string
        rootOnly:
          type: boolean
          description: Return only jobs without a parent job ID.
        metadataPredicates:
          type: array
          description: |
            Wire-format projection of `MetadataFilter`. Each predicate is a
            top-level equality match; multiple `values` on one predicate mean OR
            on the same field.
          items:
            $ref: '#/components/schemas/MetadataPredicate'
        createdAfter:
          type: string
          format: date-time
        createdBefore:
          type: string
          format: date-time
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        pageToken:
          type: string
        cellNames:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CellName'
    ProjectListJobsResponse:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectJobSummary'
        nextPageToken:
          type: string

    ProjectListLeaseEventsResponse:
      example: {events: []}
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/ProjectLeaseEvent'}
        nextPageToken: {type: string}
    ProjectPollWorkRequest:
      type: object
      additionalProperties: false
      required: [projectId, workerId, routes, limit]
      properties:
        projectId:
          type: string
          minLength: 1
          description: Required tenant polling target. Polling is scoped only to this tenant.
        workerId:
          type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        limit:
          type: integer
        longPollUntil:
          type: string
          format: date-time
        leaseDuration:
          type: string
          description: Duration string controlling how long acquired leases should be held.
        metadataEquals:
          type: array
          description: |
            Metadata equality predicates applied during polling. Multiple
            predicates mean AND across fields; multiple `values` on one
            predicate mean OR on the same field.
          items:
            $ref: '#/components/schemas/MetadataPredicate'
        cellNames:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CellName'
    ProjectSubmitRestartJob:
      type: object
      required:
        - priorJobKey
        - lastStepToKeep
        - cell
      additionalProperties: false
      properties:
        shareGoal:
          type: boolean
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        clientPayloadUpdate:
          $ref: '#/components/schemas/ClientPayloadUpdate'
        priorJobKey:
          $ref: '#/components/schemas/ProjectJobKey'
        executionRestart:
          $ref: '#/components/schemas/ExecutionRestart'
        lastStepToKeep:
          type: integer
          format: int64
        extraTaskInput:
          $ref: '#/components/schemas/TaskDataWrite'
        extraTaskOutput:
          $ref: '#/components/schemas/TaskDataWrite'
        schema:
          $ref: '#/components/schemas/JobSchemaSelector'
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/JobPrerequisite'
        cell:
          $ref: '#/components/schemas/CellName'
        cellRepo:
          $ref: '#/components/schemas/CellRepo'
    ProjectSubmitRestartJobRequest:
      type: object
      required: [job]
      additionalProperties: false
      properties:
        requestId:
          type: string
        job:
          $ref: '#/components/schemas/ProjectSubmitRestartJob'
        workerId:
          type: string
        requestTime:
          type: string
          format: date-time
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, metadata, revision, createdAt]
      properties:
        id: {type: string, description: Immutable resource address. Existing c2 and inventoried embedded 0 are preserved; creates use KSUIDs.}
        name: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$', description: Immutable creation name used only for discovery.}
        description: {type: string, maxLength: 4096}
        metadata: {type: object, additionalProperties: true, x-go-type: json.RawMessage}
        revision: {type: string}
        createdAt: {type: string, format: date-time}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [requestId, name]
      properties:
        requestId: {type: string, minLength: 1, maxLength: 256}
        name: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'}
        description: {type: string, maxLength: 4096, default: ''}
        metadata: {type: object, additionalProperties: true, default: {}, x-go-type: json.RawMessage, x-go-type-skip-optional-pointer: true}
      description: Duplicate keys, supplied IDs, control characters in RequestID, null/nonobject metadata, metadata over 64 KiB/depth 32 and descriptions over 4 KiB are rejected. Request comparison preserves numeric tokens and array order while sorting object keys; historical resource JSON is never canonicalized.
    ListProjectsResponse:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects: {type: array, items: {$ref: '#/components/schemas/Project'}}
        nextPageToken: {type: string}

    ProjectListGoalsRequest:
        properties:
            candidate:
                $ref: '#/components/schemas/GoalCandidateFilter'
            createdAfter:
                format: date-time
                type: string
            createdBefore:
                format: date-time
                type: string
            goalIds:
                items:
                    type: string
                type: array
            pageSize:
                type: integer
            pageToken:
                type: string
            states:
                items:
                    enum:
                        - OPEN
                        - SUCCEEDED
                        - FAILED
                    type: string
                type: array
            updatedAfter:
                format: date-time
                type: string
            updatedBefore:
                format: date-time
                type: string
        type: object
    ProjectListDependencyWaitsRequest:
        properties:
            consumerJobId:
                type: string
            pageSize:
                type: integer
            pageToken:
                type: string
            states:
                items:
                    enum:
                        - PENDING
                        - SATISFIED
                        - FAILED
                        - TIMED_OUT
                        - CANCELLED
                    type: string
                type: array
            target:
                $ref: '#/components/schemas/DependencyTarget'
        type: object

  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
    CellETag:
      description: Strong ETag containing the quoted opaque revision. Creation replay returns the original revision, possibly stale.
      required: true
      schema:
        type: string
      example: '"r1"'
  responses:
    CellResult:
      description: Cell record and ETag. Matching create-request replay returns the original snapshot only while the cell remains active; use GET for current state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        ETag:
          $ref: '#/components/headers/CellETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cell'
    BadRequest:
      description: invalid_request for invalid input, or invalid_page_token for a rejected cursor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: unauthorized; authentication is missing or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          required: true
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: forbidden for denied administration/target/creation authority; lease_permission_denied for an attenuated or lease lacking the required target submission scope. Inaccessible existing targets are concealed as 404 where applicable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: not_found; tenant or cell is absent or inaccessible, without distinguishing these cases.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_found
            message: Resource not found.
    InternalError:
      description: internal; unexpected server failure without implementation details.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: cell_conflict for a reserved name/alias/repo; request_conflict for requestId reuse; cell_retired for active-only mutation/replay. No partial change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: precondition_failed; If-Match does not match the current revision. No mutation occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: precondition_required; supply If-Match with a current strong ETag. No mutation occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ArchiveConflict:
      description: Retired cells cannot be archived or unarchived.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RetirementConflict:
      description: cell_busy for unfinished work/live leases/open goals/pending reservations. No state change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubmissionBadRequest:
      description: invalid_request for invalid input or missing cell name; not_found when the named cell has not been explicitly created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubmissionConflict:
      description: cell_repo_mismatch for an existing-cell repo assertion mismatch; cell_conflict for reserved name/alias/repo; cell_retired for new work in a retired cell; existing_job_mismatch for changed explicit-ID job; execution_lease_lost for expired/replaced parent lease.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResolveConflict:
      description: cell_retired for an authorized retired target, or execution_lease_lost when the parent is no longer live. No mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProjectCellResult:
      description: Cell record and ETag. Matching create-request replay returns the original snapshot only while the cell remains active; use GET for current state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        ETag:
          $ref: '#/components/headers/CellETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectCell'
