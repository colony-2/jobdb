    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ParentJobId:
      name: parentJobId
      in: path
      required: true
      schema:
        type: string
    ChildJobId:
      name: childJobId
      in: path
      required: true
      schema:
        type: string
    Ordinal:
      name: ordinal
      in: path
      required: true
      schema:
        type: integer
        format: int64
    StartOrdinal:
      name: startOrdinal
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    EndOrdinal:
      name: endOrdinal
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    ArtifactName:
      name: name
      in: path
      required: true
      schema:
        type: string
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
    JobSchemaHash:
      name: schemaHash
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobSchemaHash'
    LeaseTokenHeader:
      name: X-JobDB-Lease-Token
      in: header
      required: true
      schema:
        type: string
    CellId:
      name: cellId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CellId'
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      description: Maximum visible records; may change between pages.
    PageToken:
      name: pageToken
      in: query
      schema:
        type: string
        minLength: 1
      description: "Opaque continuation bound to tenant, authenticated principal, and filters\n(excluding pageSize). Repeat the same filters on each page. Integrity-protected;\nnot an authorization grant. Invalid, expired, or mismatched tokens return\n400 invalid_page_token. Current authorization is rechecked on every page."
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'Exactly one strong ETag from a cell response. Missing: 428; stale: 412; weak, wildcard, or list: 400.'
      schema:
        type: string
        minLength: 3
      example: '"r1"'
    StateFilter:
      name: state
      in: query
      description: Lifecycle filter. ALL includes retired cells for history and name lookup.
      schema:
        type: string
        enum:
          - ACTIVE
          - RETIRED
          - ALL
        default: ACTIVE
    NameFilter:
      name: name
      in: query
      description: Exact current name or permanent alias. Resolves at most one visible cell. Use state=ALL for retired lookup.
      schema:
        $ref: '#/components/schemas/CellName'
