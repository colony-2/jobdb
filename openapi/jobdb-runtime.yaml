openapi: 3.1.0
info:
  title: jobdb Runtime API
  version: 0.6.0
  summary: Backend-agnostic runtime protocol for jobdb remote execution
  description: |
    This API mirrors the current `jobdb.WorkflowRuntime` boundary. It
    intentionally avoids exposing direct Strata or pgwf concepts over the wire.

    The additive execution-infrastructure error envelope and optional retained
    provenance route are specified in openapi/jobdb-execution-provenance.yaml.
    They do not add a mandatory operation to backend runtime interfaces.

    Artifact bytes are committed as part of a chapter-scoped write.
    Implementations may stage uploads internally, but artifacts are not an
    independently durable write resource.

    The normative runtime guarantees for chapter ordering, chapter
    single-assignment, lease and short-lock coordination, restart boundaries,
    and artifact visibility are documented in
    `docs/SPEC-WorkflowRuntime-Guarantees.md`.
servers:
  - url: https://jobdb-runtime.example.com
tags:
  - name: configuration
    description: Tenant configuration administration and lease-authorized reads.
  - name: jobs
    description: Job lifecycle and job-level read APIs.
  - name: schemas
    description: Tenant-local JSON Schema registry for optional job validation.
  - name: leases
    description: Worker polling and lease lifecycle operations.
  - name: chapters
    description: Chapter read and commit operations.
  - name: artifacts
    description: Artifact byte reads for chapter-attached artifacts.
security:
  - bearerAuth: []
paths:
  /v1/capabilities/job-goals:
    get:
      operationId: getJobGoalCapabilities
      tags: [jobs]
      summary: Discover immutable membership, atomic admission and terminal failure support
      description: |
        Only explicitly true guarantees are supported. Primary-goal selection
        alone does not imply these guarantees. Atomic admission governs fresh
        publication; it does not certify that inherited overlaps have drained
        or that obsolete writers have stopped. Discovery never checks a goal's
        current state and cannot replace receipt replay or publication checks.
      responses:
        '200':
          description: Independently advertised backend guarantees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobGoalCapabilities'
  /v1/capabilities/primary-goal-selection:
    get:
      operationId: getPrimaryGoalSelectionCapability
      tags: [jobs]
      summary: Discover complete primary-goal selection support
      responses:
        '200':
          description: Positive support is required before selected submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryGoalSelectionCapability'
  /v1/tenants/{tenantId}/jobs/{jobId}/primary-goal:
    put:
      operationId: submitJobWithPrimaryGoal
      tags: [jobs]
      summary: Submit fresh instructions under an existing primary goal
      description: |
        Requires explicit destination identity, authenticated tenant, current goal
        access, explicit selection authority and destination submission authority.
        Publishes atomically with goal closure and cycle validation. Authorized
        identical retries return the immutable complete accepted receipt even
        after closure or soft deletion. Never use ordinary submission as fallback.
        Execution-lease and delegated credentials are unsupported on this route.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedSubmitJobRequest'
      responses:
        '200':
          description: Original complete accepted identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '400':
          description: Invalid selected request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing current goal access, selection or submission authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal or destination is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Closed goal, dependency cycle or immutable request conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Backend or credential route does not support selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Committed receipt is unavailable; do not replace destination identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/lease-events/query:
    post:
      operationId: listLeaseEvents
      tags: [leases]
      description: |
        Read-only live traversal of retained canonical acquisitions and renewals, newest first.
        Reauthorize every page. Delegated lease credentials are denied. No totals or backfill.
        Filters are OR within arrays and AND across dimensions; explicit null/empty arrays are invalid.
        Time bounds are inclusive lower and exclusive upper. Cursors bind normalized scope and page size.
        Concurrent commits and visibility/membership changes may alter traversal; refresh to find new activity.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListLeaseEventsRequest'}
      responses:
        '200':
          description: One page, including an empty events array when no visible history exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListLeaseEventsResponse'}
        '400':
          description: invalid_request or invalid_lease_event_page_token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {description: Authentication required}
        '403': {description: Permission denied, including delegated credentials}
        '404': {description: Explicit cell absent or inaccessible}
        '501':
          description: lease_events_unsupported (optional capability absent or collection disabled)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500': {description: Backend failure}
  /v1/tenants/{tenantId}/goals/query:
    post:
      tags: [jobs]
      operationId: listGoals
      description: Read-only discovery. Every page is scoped to the authorized tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListGoalsRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListGoalsResponse'}
  /v1/tenants/{tenantId}/dependency-waits/query:
    post:
      tags: [jobs]
      operationId: listDependencyWaits
      description: Read-only discovery. Every page is scoped to the authorized tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListDependencyWaitsRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDependencyWaitsResponse'}
  /v1/tenants/{tenantId}/goals/{goalId}:
    get:
      tags: [jobs]
      operationId: getGoal
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: goalId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalInfo'
  /v1/tenants/{tenantId}/goals/{goalId}/fail:
    post:
      tags: [jobs]
      operationId: failGoal
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: goalId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailGoalRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalInfo'
  /v1/tenants/{tenantId}/jobs/{jobId}/dependency-waits/{waitId}:
    get:
      tags: [jobs]
      operationId: getDependencyWait
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: jobId
          in: path
          required: true
          schema: {type: string}
        - name: waitId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyWaitInfo'
  /v1/tenants/{tenantId}/configuration:
    get:
      tags: [configuration]
      operationId: getTenantConfiguration
      summary: Read the complete tenant configuration
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        Uses administrative authorization, not lease authority. Empty tenants
        return a valid initial revision and values: {}.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Current snapshot
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/configuration/set:
    post:
      tags: [configuration]
      operationId: setTenantConfigurationValue
      summary: Set one tenant configuration value
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        Writes commit atomically. If-Match optionally requires one exact strong
        ETag for the whole tenant; mismatch returns 412 before mutation. No-op
        writes preserve revision, including removal of an absent name. A present
        JSON null is a value, not deletion. Duplicate JSON keys are rejected.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: header
          name: If-Match
          schema: {type: string}
          description: One quoted revision ETag; weak tags, lists and wildcard are invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConfigurationBody'
      responses:
        '204':
          description: Mutation committed
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Configuration revision mismatch
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/configuration/remove:
    post:
      tags: [configuration]
      operationId: removeTenantConfigurationValue
      summary: Remove one tenant configuration value
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        Writes commit atomically. If-Match optionally requires one exact strong
        ETag for the whole tenant; mismatch returns 412 before mutation. No-op
        writes preserve revision, including removal of an absent name. A present
        JSON null is a value, not deletion. Duplicate JSON keys are rejected.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: header
          name: If-Match
          schema: {type: string}
          description: One quoted revision ETag; weak tags, lists and wildcard are invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveConfigurationBody'
      responses:
        '204':
          description: Mutation committed
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Configuration revision mismatch
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/configuration:
    get:
      tags: [configuration]
      operationId: getConfigurationWithLease
      summary: Read current tenant configuration using a live lease
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        The token must match tenant, job and lease. Current ownership and token
        expiry are checked before and after storage I/O. No requested-name list.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        '200':
          description: Current snapshot
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Execution lease lost
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/start-or-append:
    post:
      tags: [jobs]
      operationId: startOrAppendJob
      summary: Start or append to a shared job generation
      description: At-least-once append. The first creator chooses the template; shared jobs have no parent identity.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOrAppendJobRequest'
      responses:
        '200':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '400':
          description: invalid_append_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: lease_permission_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: job_schema_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: append_busy; callers may explicitly retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Chapter payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/start-or-append:
    post:
      tags: [jobs]
      operationId: startOrAppendJobWithLease
      summary: Start or append to a shared job generation
      description: At-least-once append. The first creator chooses the template; shared jobs have no parent identity.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOrAppendJobRequest'
      responses:
        '200':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '400':
          description: invalid_append_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: lease_permission_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: job_schema_not_found (or a missing submission lease on the leased route)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: append_busy or a lost submission lease; callers may explicitly retry append_busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Chapter payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs:
    post:
      tags: [jobs]
      operationId: submitJob
      summary: Submit job
      description: |
        Submits a new job and writes the initial chapter (ordinal `0`). Any
        input artifacts are attached as part of that chapter creation. The
        server generates the job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{jobId}:
    put:
      tags: [jobs]
      operationId: putJob
      summary: Submit job with explicit job ID
      description: |
        Submits a new job with the path-supplied job ID and writes the initial
        chapter (ordinal `0`). This operation is idempotent for equivalent
        requests: when the job already exists with matching durable state, the
        runtime returns success; when the durable story exists but the internal
        runtime record is missing, the runtime repairs that record and returns
        success. If the existing job's durable state does not match the
        request, the runtime returns `409 existing_job_mismatch`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get job
      description: |
        Returns the current job status and a task-data view of the terminal
        payload when it is available. For non-terminal jobs, clients should
        treat an absent `data` value as a lazy `TaskData` that will surface the
        deferred runtime error when accessed.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
  /v1/tenants/{tenantId}/jobs/{jobId}/extended-metadata:
    patch:
      tags: [jobs]
      operationId: editJobMetadata
      summary: Compare and set or remove one job metadata key
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobMetadataEdit'}
      responses:
        '200':
          description: Current entry after the edit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobMetadataEntry'}
        '400':
          description: Invalid edit
        '403':
          description: Edit not authorized
        '404':
          description: Job not found
        '409':
          description: Version conflict or lost lease
        '501':
          description: Job metadata editing unavailable
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/extended-metadata:
    patch:
      tags: [jobs]
      operationId: editJobMetadataWithLease
      summary: Compare and set or remove one job metadata key
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobMetadataEdit'}
      responses:
        '200':
          description: Current entry after the edit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobMetadataEntry'}
        '400':
          description: Invalid edit
        '403':
          description: Edit not authorized
        '404':
          description: Job not found
        '409':
          description: Version conflict or lost lease
        '501':
          description: Job metadata editing unavailable
  /v1/tenants/{tenantId}/jobs/restarts:
    post:
      tags: [jobs]
      operationId: submitRestartJob
      summary: Submit restart job
      description: |
        Submits a restart derived from a prior run. Any `extraTaskInput` or
        `extraTaskOutput` artifacts are written as part of the restart chapter
        they belong to. The server generates the new job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job restart submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{jobId}/restart:
    put:
      tags: [jobs]
      operationId: putRestartJob
      summary: Submit restart job with explicit job ID
      description: |
        Submits a restart using the path-supplied destination job ID. This
        operation is idempotent for equivalent requests: when the target job
        already exists with the same copied restart prefix (and restart extra
        chapter when requested), the runtime returns success; when that durable
        state exists but the internal runtime record is missing, the runtime
        repairs that record and returns success. If the existing durable state
        does not match the request, the runtime returns
        `409 existing_job_mismatch`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job restart submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs:
    post:
      tags: [leases]
      operationId: submitJobWithLease
      summary: Submit child job with lease
      description: |
        Submits a new child job while holding the identified parent job lease.
        The request body is the same shape as `submitJob`; the parent tenant is
        taken from the path and the server records the parent job ID in internal
        job metadata.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}:
    put:
      tags: [leases]
      operationId: putJobWithLease
      summary: Submit child job with explicit job ID and lease
      description: |
        Submits a new child job with the path-supplied child job ID while
        holding the identified parent job lease. Equivalent requests are
        idempotent using the same semantics as `putJob`, including the stored
        parent job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/ChildJobId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/restarts:
    post:
      tags: [leases]
      operationId: submitRestartJobWithLease
      summary: Submit child restart job with lease
      description: |
        Submits a restart child job while holding the identified parent job
        lease. The prior job tenant must match the path tenant when supplied.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child restart job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}/restart:
    put:
      tags: [leases]
      operationId: putRestartJobWithLease
      summary: Submit child restart job with explicit job ID and lease
      description: |
        Submits a restart child job with the path-supplied child job ID while
        holding the identified parent job lease. Equivalent requests are
        idempotent using the same semantics as `putRestartJob`, including the
        stored parent job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/ChildJobId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child restart job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/delete:
    post:
      tags: [jobs]
      operationId: deleteJobs
      summary: Delete jobs selected by age, IDs, and application metadata
      description: |
        Hides matching jobs from job listings and revokes leases.
        Unfinished jobs are cancelled and cannot be picked up again. Completed
        outcomes are preserved. Direct job reads remain available. All selectors intersect; jobIds are ORed.
        createdBefore is exclusive and uses job creation time, not completion time.
        Requires a selector or explicit all=true. No implicit child cascade.
        IDs continue to identify the same jobs. History, artifacts, and terminal dependency
        facts are retained for surviving references; this is not a storage purge.
        Raw chapter/artifact reads remain available. Dry runs only count matches
        and do not reserve the selection for a later request.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteJobsRequest'
      responses:
        '200':
          description: Atomic deletion or dry-run count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJobsResponse'
        '400':
          description: Invalid deletion selector
        '501':
          description: Backend does not implement job deletion
  /v1/tenants/{tenantId}/jobs/query:
    post:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs
      description: |
        Lists jobs within the tenant identified by the path.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListJobsRequest'
      responses:
        '200':
          description: Listed jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobsResponse'
  /v1/tenants/{tenantId}/schemas:
    post:
      tags: [schemas]
      operationId: registerJobSchema
      summary: Register job schema
      description: |
        Registers an immutable tenant-local JSON Schema. Registering identical
        content is idempotent and returns the existing schema row.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterJobSchemaRequest'
      responses:
        '200':
          description: Schema registered or already present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSchemaInfo'
        '409':
          description: Existing schema hash conflicts with different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [schemas]
      operationId: listJobSchemas
      summary: List job schemas
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobSchemaListState'
      responses:
        '200':
          description: Schemas listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobSchemasResponse'
  /v1/tenants/{tenantId}/schemas/{schemaHash}:
    get:
      tags: [schemas]
      operationId: getJobSchema
      summary: Get job schema
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobSchemaHash'
      responses:
        '200':
          description: Schema loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSchemaInfo'
  /v1/tenants/{tenantId}/schemas/{schemaHash}/archive:
    post:
      tags: [schemas]
      operationId: archiveJobSchema
      summary: Archive job schema
      description: |
        Archives a schema for future job creation. Existing mutable jobs that
        already reference the schema may continue to validate writes with it.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobSchemaHash'
      responses:
        '200':
          description: Schema archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSchemaInfo'
  /v1/jobs/poll:
    post:
      tags: [leases]
      operationId: pollWork
      summary: Poll work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollWorkRequest'
      responses:
        '200':
          description: Work leases
          content:
            application/json:
              schema:
                type: object
                required: [leases]
                properties:
                  leases:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExecutionLease'
  /v1/tenants/{tenantId}/jobs/{jobId}/lease:
    post:
      tags: [leases]
      operationId: getJobLease
      summary: Get job lease
      description: |
        Attempts to acquire a lease for one specific job. The response always
        succeeds at the transport level when the lookup itself succeeds; a
        missing lease is represented as `lease: null`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetJobLeaseRequest'
      responses:
        '200':
          description: Lease acquired or currently unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobLeaseResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/secrets/resolve:
    post:
      tags: [leases]
      operationId: resolveSecretsWithLease
      summary: Resolve the allowed subset of requested job secrets
      description: |
        Requires a live lease. Principal comes only from a verified signed lease
        claim; missing claims become nil. Application metadata comes from the job.
        JobDB never caches provider output or persists resolution results.
        SQLite supports the development provider; other backends currently
        return secrets_not_supported (no secret provider configured).
        All responses use Cache-Control: no-store. Default request/response limits
        are 64 KiB/1 MiB; SQLite SecretLimits can configure them.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSecretsBody'
      responses:
        '200':
          description: Allowed requested values; unknown and denied names are omitted
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResolveResult'
        default:
          description: |
            Sanitized error with no values: 400 invalid_secret_request,
            409 execution_lease_lost, 413 secret_request_too_large,
            500 secret_resolution_failed, 501 secrets_not_supported,
            or 503 secrets_unavailable. Provider failures return no partial values.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretError'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/delegations:
    post:
      tags: [leases]
      operationId: createLeaseDelegation
      summary: Create a restricted lease from an owner lease
      description: Issues a macaroon with authenticated permissions and an optional notAfter deadline, valid while the exact parent lease remains live. The Go SDK derives these locally; holders may further narrow the grant offline. No individual revocation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegationRequest'
      responses:
        '200':
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLease'
        default:
          description: '400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}:
    get:
      tags: [leases]
      operationId: inspectLease
      summary: Validate a delegated lease without renewal
      description: Returns only identity, route, validity and delegation policy. Used to import restricted leases without refreshing a current credential.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        '200':
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLease'
        default:
          description: '400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/chapters:
    get:
      tags: [chapters]
      operationId: listChaptersWithLease
      summary: Read only chapters allowed by the lease
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
        - $ref: '#/components/parameters/StartOrdinal'
        - $ref: '#/components/parameters/EndOrdinal'
      responses:
        '200':
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChaptersResponse'
        default:
          description: '400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/chapters/{ordinal}:
    get:
      tags: [chapters]
      operationId: getChapterWithLease
      summary: Read one chapter allowed by the lease
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
        - $ref: '#/components/parameters/Ordinal'
      responses:
        '200':
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterRecord'
        default:
          description: '400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/keepalive:
    post:
      tags: [leases]
      operationId: keepAliveLease
      summary: Keep lease alive
      description: For a delegation, validates the live parent and optional hard deadline and returns a restricted snapshot with the same token. Never extends the parent or the hard deadline. Restrictions remain unchanged.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        '200':
          description: Lease extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeepAliveLeaseResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/complete:
    post:
      tags: [leases]
      operationId: completeJobWithLease
      summary: Complete job with lease
      description: |
        Completes the current job attempt in the context of the identified
        lease.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteExecutionRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Job completion applied
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/resource-backoff:
    post:
      tags: [leases]
      operationId: rescheduleResourceBackoff
      summary: Atomically suspend for resource backoff or replay its exact receipt
      description: Signature, audience and exact scope remain required for retained receipt replay after expiry. No fresh mutation is authorized by an expired credential.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceBackoffRequest'
      responses:
        '200':
          description: Immutable accepted receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBackoffReceipt'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/reschedule:
    post:
      tags: [leases]
      operationId: rescheduleJobWithLease
      summary: Reschedule job with lease
      description: |
        Reschedules the current job in the context of the identified lease.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleExecutionRequest'
      responses:
        '204':
          description: Job rescheduled
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/add_chapter:
    post:
      tags: [leases]
      operationId: addChapterWithLease
      summary: Add chapter with lease
      description: |
        Commits a chapter in the context of the identified lease, including any
        attached artifact bytes. The target chapter ordinal is supplied in the
        request body as `chapter.ordinal`. Artifacts are chapter-scoped
        attachments, not standalone durable resources. Conflicting writes, such
        as duplicate ordinals or non-appendable ordinals, must fail rather than
        being treated as successful no-ops.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChapterRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Chapter stored
        '409':
          description: Conflicting chapter write
  /v1/tenants/{tenantId}/jobs/{jobId}/clear-crash-concern:
    post:
      tags: [jobs]
      operationId: clearCrashConcern
      summary: Clear consecutive crash concern for an inactive job
      description: |
        Operator action using deployment authorization, like cancellation.
        Delegated lease credentials cannot call this endpoint.
        Atomically reset the consecutive expired-lease count. Preserve the job ID,
        history, payload, routing, dependencies, availability, execution deadlines,
        and lifetime expiration statistics. This does not acquire a lease or
        immediately execute the job. Other scheduling constraints still apply.
        Reject live leases, completed, cancelled, or hidden jobs with 409.
        Clearing an already-clear inactive job succeeds without changing it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearCrashConcernRequest'
            example:
              reason: Worker deployment repaired
              workerId: operator
      responses:
        '204':
          description: Crash concern cleared; normal scheduling eligibility applies.
        '400':
          description: Invalid request.
        '403':
          description: Caller is not authorized; delegated lease credentials are denied.
        '404':
          description: Job not found in this tenant.
        '409':
          description: Job has a live lease or is completed, cancelled, or hidden.
  /v1/tenants/{tenantId}/jobs/{jobId}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel job
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJobRequest'
      responses:
        '204':
          description: Job cancelled
  /v1/tenants/{tenantId}/jobs/{jobId}/chapters:
    get:
