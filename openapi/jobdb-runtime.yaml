components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    leaseToken:
      type: apiKey
      in: header
      name: X-JobDB-Lease-Token
      description: Cell name is required and must resolve to an explicitly created, active cell in the tenant. Optional cellRepo asserts the repository mapping; it never creates a cell. Missing cells return not_found. Normal leases may submit to all registered active cells in their tenant; an explicit delegation cellNames list narrows the allowed targets. Delegation restrictions always apply. Cell names, including root, grant no special authority. Job IDs remain unique across the tenant. Existing jobs and restarts retain their repository snapshots.
