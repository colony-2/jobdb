          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobLeaseResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/secrets/resolve:
    post:
      tags: [leases]
      operationId: resolveSecretsWithLease
      summary: Resolve the allowed subset of requested job secrets
      description: |
        Requires a live lease. Principal comes only from a verified signed lease
        claim; missing claims become nil. Application metadata comes from the job.
        JobDB never caches provider output or persists resolution results.
        SQLite supports the development provider; other backends currently
        return secrets_not_supported (no secret provider configured).
        All responses use Cache-Control: no-store. Default request/response limits
        are 64 KiB/1 MiB; SQLite SecretLimits can configure them.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSecretsBody'
      responses:
        '200':
          description: Allowed requested values; unknown and denied names are omitted
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResolveResult'
        default:
          description: |
            Sanitized error with no values: 400 invalid_secret_request,
            409 execution_lease_lost, 413 secret_request_too_large,
            500 secret_resolution_failed, 501 secrets_not_supported,
            or 503 secrets_unavailable. Provider failures return no partial values.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretError'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/delegations:
    post:
      tags: [leases]
      operationId: createLeaseDelegation
      summary: Create a restricted lease from an owner lease
      description: Issues a macaroon with authenticated permissions and an optional notAfter deadline, valid while the exact parent lease remains live. The Go SDK derives these locally; holders may further narrow the grant offline. No individual revocation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegationRequest'
      responses:
        '200':
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLease'
        default:
          description: '400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}:
    get:
      tags: [leases]
      operationId: inspectLease
      summary: Validate a delegated lease without renewal
      description: Returns only identity, route, validity and delegation policy. Used to import restricted leases without refreshing a current credential.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        '200':
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLease'
        default:
          description: '400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/chapters:
