      additionalProperties: false
      properties:
        scopeId:
          type: string
        payload:
          $ref: '#/components/schemas/ApplicationPayload'

    DependencyWaitSummary:
      type: object
      additionalProperties: false
      required: [waitId]
      x-go-type: jobdb.DependencyWaitSummary
      x-go-type-import:
        name: jobdb
