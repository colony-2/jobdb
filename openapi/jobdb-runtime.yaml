  /v1/projects/{projectId}/jobs/{jobId}/chapters/{ordinal}/commit-if-waiting:
    post:
      description: |
        Conditional chapter commit used to implement
        `TaskHandle.Finish(...)` above the runtime. The runtime acquires the
        necessary job-level coordination, verifies the supplied waiting-task
        guards, writes the chapter at `{ordinal}`, and advances the job
        atomically. If the job is no longer waiting on the described task, or
        the supplied guard fields do not match, the runtime must fail with a
        conflict response rather than silently succeeding.
      operationId: ProjectcommitChapterIfWaiting
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Ordinal'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitChapterIfWaitingRequest'
        required: true
      responses:
        "204":
          description: Chapter commit applied
        "409":
          description: Waiting-task conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Commit chapter if waiting
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/clear-crash-concern:
    post:
      description: |
        Operator action using deployment authorization, like cancellation.
        Delegated lease credentials cannot call this endpoint.
        Atomically reset the consecutive expired-lease count. Preserve the job ID,
        history, payload, routing, dependencies, availability, execution deadlines,
        and lifetime expiration statistics. This does not acquire a lease or
        immediately execute the job. Other scheduling constraints still apply.
        Reject live leases, completed, cancelled, or hidden jobs with 409.
        Clearing an already-clear inactive job succeeds without changing it.
      operationId: ProjectclearCrashConcern
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        content:
          application/json:
            example:
              reason: Worker deployment repaired
              workerId: operator
            schema:
              $ref: '#/components/schemas/ClearCrashConcernRequest'
        required: true
      responses:
        "204":
          description: Crash concern cleared; normal scheduling eligibility applies.
        "400":
          description: Invalid request.
        "403":
          description: Caller is not authorized; delegated lease credentials are denied.
        "404":
          description: Job not found in this tenant.
        "409":
          description: Job has a live lease or is completed, cancelled, or hidden.
      security:
        - bearerAuth: []
      summary: Clear consecutive crash concern for an inactive job
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/dependency-waits/{waitId}:
    get:
      operationId: ProjectgetDependencyWait
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: jobId
          required: true
          schema:
            type: string
        - in: path
          name: waitId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDependencyWaitInfo'
          description: Success
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/lease:
    post:
      description: |
        Attempts to acquire a lease for one specific job. The response always
        succeeds at the transport level when the lookup itself succeeds; a
        missing lease is represented as `lease: null`.
      operationId: ProjectgetJobLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetJobLeaseRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGetJobLeaseResponse'
          description: Lease acquired or currently unavailable
      summary: Get job lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}:
    get:
      description: Returns only identity, route, validity and delegation policy. Used to import restricted leases without refreshing a current credential.
      operationId: ProjectinspectLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectExecutionLease'
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.
      summary: Validate a delegated lease without renewal
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/add_chapter:
    post:
      description: |
        Commits a chapter in the context of the identified lease, including any
        attached artifact bytes. The target chapter ordinal is supplied in the
        request body as `chapter.ordinal`. Artifacts are chapter-scoped
        attachments, not standalone durable resources. Conflicting writes, such
        as duplicate ordinals or non-appendable ordinals, must fail rather than
        being treated as successful no-ops.
      operationId: ProjectaddChapterWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChapterRequest'
        required: true
      responses:
        "204":
          description: Chapter stored
        "409":
          description: Conflicting chapter write
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Add chapter with lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/chapters:
    get:
      operationId: ProjectlistChaptersWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
        - $ref: '#/components/parameters/StartOrdinal'
        - $ref: '#/components/parameters/EndOrdinal'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChaptersResponse'
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.
      summary: Read only chapters allowed by the lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/chapters/{ordinal}:
    get:
      operationId: ProjectgetChapterWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
        - $ref: '#/components/parameters/Ordinal'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterRecord'
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.
      summary: Read one chapter allowed by the lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/complete:
    post:
      description: |
        Completes the current job attempt in the context of the identified
        lease.
      operationId: ProjectcompleteJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteExecutionRequest'
        required: true
      responses:
        "204":
          description: Job completion applied
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Complete job with lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/configuration:
    get:
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        The token must match tenant, job and lease. Current ownership and token
        expiry are checked before and after storage I/O. No requested-name list.
      operationId: ProjectgetConfigurationWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
          description: Current snapshot
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            ETag:
              description: Quoted tenant revision.
              required: true
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Execution lease lost
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
      summary: Read current tenant configuration using a live lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/delegations:
    post:
      description: Issues a macaroon with authenticated permissions and an optional notAfter deadline, valid while the exact parent lease remains live. The Go SDK derives these locally; holders may further narrow the grant offline. No individual revocation.
      operationId: ProjectcreateLeaseDelegation
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectExecutionLease'
          description: Authorized result; delegation responses contain no owner credentials or execution payload.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 400 invalid request; 401 invalid or expired delegation; 403 permission denied or deadline reached; 409 parent lease lost.
      summary: Create a restricted lease from an owner lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/keepalive:
    post:
      description: For a delegation, validates the live parent and optional hard deadline and returns a restricted snapshot with the same token. Never extends the parent or the hard deadline. Restrictions remain unchanged.
      operationId: ProjectkeepAliveLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectKeepAliveLeaseResponse'
          description: Lease extended
      summary: Keep lease alive
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/resource-backoff:
    post:
      tags: [projects]
      operationId: ProjectrescheduleResourceBackoff
      summary: Atomically suspend for resource backoff or replay its exact receipt
      description: Signature, audience and exact scope remain required for retained receipt replay after expiry. No fresh mutation is authorized by an expired credential.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceBackoffRequest'
      responses:
        '200':
          description: Immutable accepted receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBackoffReceipt'
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/reschedule:
    post:
      description: |
        Reschedules the current job in the context of the identified lease.
      operationId: ProjectrescheduleJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleExecutionRequest'
        required: true
      responses:
        "204":
          description: Job rescheduled
      summary: Reschedule job with lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/leases/{leaseId}/secrets/resolve:
    post:
      description: |
        Requires a live lease. Principal comes only from a verified signed lease
        claim; missing claims become nil. Application metadata comes from the job.
        JobDB never caches provider output or persists resolution results.
        SQLite supports the development provider; other backends currently
        return secrets_not_supported (no secret provider configured).
        All responses use Cache-Control: no-store. Default request/response limits
        are 64 KiB/1 MiB; SQLite SecretLimits can configure them.
      operationId: ProjectresolveSecretsWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSecretsBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResolveResult'
          description: Allowed requested values; unknown and denied names are omitted
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretError'
          description: |
            Sanitized error with no values: 400 invalid_secret_request,
            409 execution_lease_lost, 413 secret_request_too_large,
            500 secret_resolution_failed, 501 secrets_not_supported,
            or 503 secrets_unavailable. Provider failures return no partial values.
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
      summary: Resolve the allowed subset of requested job secrets
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/primary-goal:
    put:
      description: |
        Requires explicit destination identity, authenticated tenant, current goal
        access, explicit selection authority and destination submission authority.
        Publishes atomically with goal closure and cycle validation. Authorized
        identical retries return the immutable complete accepted receipt even
        after closure or soft deletion. Never use ordinary submission as fallback.
        Execution-lease and delegated credentials are unsupported on this route.
      operationId: ProjectsubmitJobWithPrimaryGoal
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedSubmitJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Original complete accepted identity
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid selected request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing current goal access, selection or submission authority
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Goal or destination is missing
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Closed goal, dependency cycle or immutable request conflict
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Backend or credential route does not support selection
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Committed receipt is unavailable; do not replace destination identity
      summary: Submit fresh instructions under an existing primary goal
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{jobId}/restart:
    put:
      description: |
        Submits a restart using the path-supplied destination job ID. This
        operation is idempotent for equivalent requests: when the target job
        already exists with the same copied restart prefix (and restart extra
        chapter when requested), the runtime returns success; when that durable
        state exists but the internal runtime record is missing, the runtime
        repairs that record and returns success. If the existing durable state
        does not match the request, the runtime returns
        `409 existing_job_mismatch`.
      operationId: ProjectputRestartJob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSubmitRestartJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Job restart submitted or confirmed/recovered
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Existing job does not match the requested durable state
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Submit restart job with explicit job ID
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/cells:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ParentJobId'
      - $ref: '#/components/parameters/LeaseId'
    post:
      description: Owner leases may create cells in their tenant. Delegated leases require cells.create and the requested name must match its selector. Verify the signed lease, path binding, attenuation, deadline, and live parent before mutation. Creation never expands submission scope. All names, including root, follow the same rules. requestId replay is scoped to the tenant and exact parent lease identity. No Git operation occurs.
      operationId: ProjectcreateCellWithLease
      parameters:
        - in: header
          name: X-JobDB-Lease-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCellRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCell'
          description: Cell created or original creation replayed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/CellETag'
            Location:
              description: URI of the created cell.
              schema:
                format: uri-reference
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
          leaseToken: []
      summary: Explicitly create a cell using a live execution lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/cells/lookup:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ParentJobId'
      - $ref: '#/components/parameters/LeaseId'
    post:
      description: |
        Validate the live owning or delegated lease, path binding, and delegation
        restrictions and deadline. Any valid lease, including an empty delegation,
        may look up any active cell in its tenant without jobs.submit, a lookup
        grant, administrative access, or a cell listing grant. Submission cell
        filters do not restrict lookup. Exact names and permanent aliases return
        the current canonical name, immutable ID, and registered repository.
        Each response is a coherent registry snapshot; later calls may observe
        registry edits. Lookup performs no registry mutation, job submission, Git
        access, or permission change. Submission and restart independently recheck
        all existing authority and repository assertions.
      operationId: ProjectlookupCellWithLease
      parameters:
        - in: header
          name: X-JobDB-Lease-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupCellRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedCell'
          description: Current active cell identity and repository.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/ResolveConflict'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - leaseToken: []
      summary: Look up an active cell independently of submission authority
      tags:
        - projects
      x-jobdb-authorization:
        authority: live execution lease
        effect: name/ID/repository lookup only
        target: authenticated lease tenant
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/cells/resolve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ParentJobId'
      - $ref: '#/components/parameters/LeaseId'
    post:
      description: |-
        Read-only. Verify the signed live lease, path binding, attenuation, and deadline.
        Require effective jobs.submit authority and target-cell scope. Normal lease scope includes all registered active cells in the tenant; explicit principal or delegation restrictions may narrow it. A delegation without jobs.submit cannot resolve targets.
        Return canonical cell name, immutable ID, and registered repo only. This supports
        name-only c2j requests that must load a recipe before job submission. It grants
        no cell metadata, job history, or secret access. Job-type/job-ID restrictions
        remain checked at submission; resolution cannot expand them.

        Missing or inaccessible names return 404. An authorized retired cell returns
        409 cell_retired. Current names and reserved aliases resolve to the same ID.
        No registration, job creation, Git network call, or policy mutation occurs.
        Subsequent submission must recheck authority, repo assertion, and active state.
      operationId: ProjectresolveCellWithLease
      parameters:
        - in: header
          name: X-JobDB-Lease-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              cell: payments
            schema:
              $ref: '#/components/schemas/ResolveCellRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                cell: payments
                cellId: cell_019d03e9-066b-76b3-9b46-47d306b0aa1f
                cellRepo: github.com/colony-2/payments
              schema:
                $ref: '#/components/schemas/ResolvedCell'
          description: Minimal active cell identity and repository.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/ResolveConflict'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
          leaseToken: []
      summary: Resolve an active cell name within lease submission scope
      tags:
        - projects
      x-jobdb-authorization:
        effect: bounded name/ID/repo resolution only
        permission: jobs.submit
        target: effective submission cell scope
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/jobs:
    post:
      description: |
        Submits a new child job while holding the identified parent job lease.
        The request body is the same shape as `submitJob`; the parent tenant is
        taken from the path and the server records the parent job ID in internal
        job metadata.
      operationId: ProjectsubmitJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Child job submitted
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Submit child job with lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}:
    put:
      description: |
        Submits a new child job with the path-supplied child job ID while
        holding the identified parent job lease. Equivalent requests are
        idempotent using the same semantics as `putJob`, including the stored
        parent job ID.
      operationId: ProjectputJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/ChildJobId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Child job submitted or confirmed/recovered
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Existing job does not match the requested durable state
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Submit child job with explicit job ID and lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}/restart:
    put:
      description: |
        Submits a restart child job with the path-supplied child job ID while
        holding the identified parent job lease. Equivalent requests are
        idempotent using the same semantics as `putRestartJob`, including the
        stored parent job ID.
      operationId: ProjectputRestartJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/ChildJobId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSubmitRestartJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Child restart job submitted or confirmed/recovered
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Existing job does not match the requested durable state
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Submit child restart job with explicit job ID and lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/jobs/restarts:
    post:
      description: |
        Submits a restart child job while holding the identified parent job
        lease. The prior job tenant must match the path tenant when supplied.
      operationId: ProjectsubmitRestartJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSubmitRestartJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Child restart job submitted
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Submit child restart job with lease
      tags:
        - projects
  /v1/projects/{projectId}/jobs/{parentJobId}/leases/{leaseId}/jobs/start-or-append:
    post:
      description: At-least-once append. The first creator chooses the template; shared jobs have no parent identity.
      operationId: ProjectstartOrAppendJobWithLease
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOrAppendJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Job accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_append_request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: lease_permission_denied
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: job_schema_not_found (or a missing submission lease on the leased route)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: append_busy or a lost submission lease; callers may explicitly retry append_busy
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter payload too large
      summary: Start or append to a shared job generation
      tags:
        - projects
  /v1/projects/{projectId}/jobs/delete:
    post:
      description: |
        Hides matching jobs from job listings and revokes leases.
        Unfinished jobs are cancelled and cannot be picked up again. Completed
        outcomes are preserved. Direct job reads remain available. All selectors intersect; jobIds are ORed.
        createdBefore is exclusive and uses job creation time, not completion time.
        Requires a selector or explicit all=true. No implicit child cascade.
        IDs continue to identify the same jobs. History, artifacts, and terminal dependency
        facts are retained for surviving references; this is not a storage purge.
        Raw chapter/artifact reads remain available. Dry runs only count matches
        and do not reserve the selection for a later request.
      operationId: ProjectdeleteJobs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteJobsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJobsResponse'
          description: Atomic deletion or dry-run count
        "400":
          description: Invalid deletion selector
        "501":
          description: Backend does not implement job deletion
      summary: Delete jobs selected by age, IDs, and application metadata
      tags:
        - projects
  /v1/projects/{projectId}/jobs/poll:
    post:
      operationId: ProjectpollWork
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPollWorkRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  leases:
                    items:
                      $ref: '#/components/schemas/ProjectExecutionLease'
                    type: array
                required:
                  - leases
                type: object
          description: Work leases
      summary: Poll work
      tags:
        - projects
  /v1/projects/{projectId}/jobs/query:
    post:
      description: |
        Lists jobs within the tenant identified by the path.
      operationId: ProjectlistJobs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectListJobsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListJobsResponse'
          description: Listed jobs
      summary: List jobs
      tags:
        - projects
  /v1/projects/{projectId}/jobs/restarts:
    post:
      description: |
        Submits a restart derived from a prior run. Any `extraTaskInput` or
        `extraTaskOutput` artifacts are written as part of the restart chapter
        they belong to. The server generates the new job ID.
      operationId: ProjectsubmitRestartJob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSubmitRestartJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Job restart submitted
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter application payload exceeds the configured byte budget
      summary: Submit restart job
      tags:
        - projects
  /v1/projects/{projectId}/jobs/start-or-append:
    post:
      description: At-least-once append. The first creator chooses the template; shared jobs have no parent identity.
      operationId: ProjectstartOrAppendJob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOrAppendJobRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobHandle'
          description: Job accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_append_request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: lease_permission_denied
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: job_schema_not_found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: append_busy; callers may explicitly retry
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Chapter payload too large
      summary: Start or append to a shared job generation
      tags:
        - projects
  /v1/projects/{projectId}/lease-events/query:
    post:
      description: |
        Read-only live traversal of retained canonical acquisitions and renewals, newest first.
        Reauthorize every page. Delegated lease credentials are denied. No totals or backfill.
        Filters are OR within arrays and AND across dimensions; explicit null/empty arrays are invalid.
        Time bounds are inclusive lower and exclusive upper. Cursors bind normalized scope and page size.
        Concurrent commits and visibility/membership changes may alter traversal; refresh to find new activity.
      operationId: ProjectlistLeaseEvents
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListLeaseEventsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListLeaseEventsResponse'
          description: One page, including an empty events array when no visible history exists.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_request or invalid_lease_event_page_token
        "401":
          description: Authentication required
        "403":
          description: Permission denied
          including delegated credentials: null
        "404":
          description: Explicit cell absent or inaccessible
        "500":
          description: Backend failure
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: lease_events_unsupported (optional capability absent or collection disabled)
      tags:
        - projects
  /v1/projects/{projectId}/schemas:
    get:
      operationId: ProjectlistJobSchemas
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - in: query
          name: state
          required: false
          schema:
            $ref: '#/components/schemas/JobSchemaListState'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListJobSchemasResponse'
          description: Schemas listed
      summary: List job schemas
      tags:
        - projects
    post:
      description: |
        Registers an immutable tenant-local JSON Schema. Registering identical
        content is idempotent and returns the existing schema row.
      operationId: ProjectregisterJobSchema
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterJobSchemaRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobSchemaInfo'
          description: Schema registered or already present
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Existing schema hash conflicts with different content
      summary: Register job schema
      tags:
        - projects
  /v1/projects/{projectId}/schemas/{schemaHash}:
    get:
      operationId: ProjectgetJobSchema
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobSchemaHash'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobSchemaInfo'
          description: Schema loaded
      summary: Get job schema
      tags:
        - projects
  /v1/projects/{projectId}/schemas/{schemaHash}/archive:
    post:
      description: |
        Archives a schema for future job creation. Existing mutable jobs that
        already reference the schema may continue to validate writes with it.
      operationId: ProjectarchiveJobSchema
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobSchemaHash'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectJobSchemaInfo'
          description: Schema archived
      summary: Archive job schema
      tags:
        - projects

  /v1/projects:
    get:
      operationId: ListProjects
      tags: [projects]
      parameters:
        - {name: name, in: query, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: pageToken, in: query, schema: {type: string}}
      responses:
        '200':
          description: Active catalog entries ordered by ID; requires existing administration authority.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ListProjectsResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Catalog unavailable or not installed.}
    post:
      operationId: CreateProject
      tags: [projects]
      description: Atomically create a KSUID identity and immutable RequestID receipt. Equal retries replay the original response, including after deletion. Changed request fields conflict. Requires existing administration authority; a lease or cell grant is insufficient.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateProjectRequest'}}}
      responses:
        '201':
          description: Original immutable creation response.
          headers:
            ETag: {schema: {type: string}, description: Strong project revision.}
            Location: {schema: {type: string}, description: Project ID resource URI.}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {description: Catalog unavailable or not installed.}
  /v1/projects/{projectId}:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: GetProject
      tags: [projects]
      responses:
        '200':
          description: Active immutable project, addressed only by ID; requires administration authority.
          headers:
            ETag: {schema: {type: string}, description: Strong project revision.}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Catalog unavailable or not installed.}
    delete:
      operationId: DeleteProject
      tags: [projects]
      description: Tombstone a provably unused project. Any first-use seal, external use or unknown participant coverage refuses deletion. Receipts and the ID remain reserved. Requires existing administration authority.
      parameters: [{name: If-Match, in: header, required: true, schema: {type: string}}]
      responses:
        '204': {description: Tombstoned; name released.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {description: Stale project revision.}
        '428': {description: If-Match required.}
        '503': {description: Catalog unavailable or not installed.}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    leaseToken:
      type: apiKey
      in: header
      name: X-JobDB-Lease-Token
      description: Cell name is required and must resolve to an explicitly created, active cell in the tenant. Optional cellRepo asserts the repository mapping; it never creates a cell. Missing cells return not_found. Normal leases may submit to all registered active cells in their tenant; an explicit delegation cellNames list narrows the allowed targets. Delegation restrictions always apply. Cell names, including root, grant no special authority. Job IDs remain unique across the tenant. Existing jobs and restarts retain their repository snapshots.
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ParentJobId:
      name: parentJobId
      in: path
      required: true
      schema:
        type: string
    ChildJobId:
      name: childJobId
      in: path
      required: true
      schema:
        type: string
    Ordinal:
      name: ordinal
      in: path
      required: true
      schema:
        type: integer
        format: int64
    StartOrdinal:
      name: startOrdinal
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    EndOrdinal:
      name: endOrdinal
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    ArtifactName:
      name: name
      in: path
      required: true
      schema:
        type: string
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
    JobSchemaHash:
      name: schemaHash
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobSchemaHash'
    LeaseTokenHeader:
      name: X-JobDB-Lease-Token
      in: header
      required: true
      schema:
        type: string
    CellId:
      name: cellId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CellId'
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      description: Maximum visible records; may change between pages.
    PageToken:
      name: pageToken
      in: query
      schema:
        type: string
        minLength: 1
      description: "Opaque continuation bound to tenant, authenticated principal, and filters\n(excluding pageSize). Repeat the same filters on each page. Integrity-protected;\nnot an authorization grant. Invalid, expired, or mismatched tokens return\n400 invalid_page_token. Current authorization is rechecked on every page."
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'Exactly one strong ETag from a cell response. Missing: 428; stale: 412; weak, wildcard, or list: 400.'
      schema:
        type: string
        minLength: 3
      example: '"r1"'
    ArchivedFilter:
      name: archived
      in: query
      description: True selects marked cells, false selects unmarked cells, and omission does not filter by archive marker. Combines with the lifecycle filter.
      schema:
        type: boolean
    StateFilter:
      name: state
      in: query
      description: Lifecycle filter. ALL includes retired cells for history and name lookup.
      schema:
        type: string
        enum:
          - ACTIVE
          - RETIRED
          - ALL
        default: ACTIVE
    NameFilter:
      name: name
      in: query
      description: Exact current name or permanent alias. Resolves at most one visible cell. Use state=ALL for retired lookup.
      schema:
        $ref: '#/components/schemas/CellName'
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
  schemas:
    LeaseEventType:
      type: string
      enum: [lease_acquired, lease_renewed]
    LeaseAcquisitionSource:
      type: string
      enum: [poll, targeted, task_completion, append]
    ListLeaseEventsRequest:
      example: {jobIds: [job-1], eventTypes: [lease_acquired], pageSize: 1}
      type: object
      additionalProperties: false
      properties:
        cellNames:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        cellIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        jobIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        goalIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        workerIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        leaseIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        eventTypes:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/LeaseEventType'}
        jobTypes:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        routes:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/Route'}
        occurredAfter: {type: string, format: date-time}
        occurredBefore: {type: string, format: date-time}
        includeHidden: {type: boolean, default: false}
        pageSize: {type: integer, minimum: 1, maximum: 200, default: 100}
        pageToken: {type: string}
    ListLeaseEventsResponse:
      example: {events: []}
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/LeaseEvent'}
        nextPageToken: {type: string}
    LeaseEvent:
      type: object
      additionalProperties: false
      description: Immutable scheduler snapshot. Acquisitions require acquisitionSource and omit previousLeaseExpiresAt; renewals require previousLeaseExpiresAt and omit acquisitionSource and previousLeaseId. Tokens and credentials are never returned. Renewal can shorten expiry.
      required: [eventId, eventType, occurredAt, jobKey, cell, cellId, cellRepo, goalId, jobType, route, leaseId, workerId, leaseExpiresAt]
      properties:
        eventId: {type: string}
        eventType: {$ref: '#/components/schemas/LeaseEventType'}
        occurredAt: {type: string, format: date-time}
        jobKey: {$ref: '#/components/schemas/JobKey'}
        cell: {type: string}
        cellId: {type: string}
        cellRepo: {type: string}
        goalId: {type: string}
        jobType: {type: string}
        route: {$ref: '#/components/schemas/Route'}
        leaseId: {type: string}
        workerId: {type: string}
        leaseExpiresAt: {type: string, format: date-time}
        previousLeaseExpiresAt: {type: string, format: date-time}
        acquisitionSource: {$ref: '#/components/schemas/LeaseAcquisitionSource'}
        previousLeaseId: {type: string}
    GoalKey:
      type: object
      additionalProperties: false
      required: [tenantId, goalId]
      x-go-type: jobdb.GoalKey
      x-go-type-import:
        name: jobdb
