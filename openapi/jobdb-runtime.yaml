openapi: 3.1.0
info:
  title: jobdb Runtime API
  version: 0.6.0
  summary: Backend-agnostic runtime protocol for jobdb remote execution
  description: |
    This API mirrors the current `jobdb.WorkflowRuntime` boundary. It
    intentionally avoids exposing direct Strata or pgwf concepts over the wire.

    Artifact bytes are committed as part of a chapter-scoped write.
    Implementations may stage uploads internally, but artifacts are not an
    independently durable write resource.

    The normative runtime guarantees for chapter ordering, chapter
    single-assignment, lease and short-lock coordination, restart boundaries,
    and artifact visibility are documented in
    `docs/SPEC-WorkflowRuntime-Guarantees.md`.
servers:
  - url: https://jobdb-runtime.example.com
tags:
  - name: configuration
    description: Tenant configuration administration and lease-authorized reads.
  - name: jobs
    description: Job lifecycle and job-level read APIs.
  - name: schedules
    description: Schedule lifecycle, projection, and run APIs.
  - name: schemas
    description: Tenant-local JSON Schema registry for optional job validation.
  - name: leases
    description: Worker polling and lease lifecycle operations.
  - name: chapters
    description: Chapter read and commit operations.
  - name: artifacts
    description: Artifact byte reads for chapter-attached artifacts.
security:
  - bearerAuth: []
paths:
  /v1/tenants/{tenantId}/lease-events/query:
    post:
      operationId: listLeaseEvents
      tags: [leases]
      description: |
        Read-only live traversal of retained canonical acquisitions and renewals, newest first.
        Reauthorize every page. Delegated lease credentials are denied. No totals or backfill.
        Filters are OR within arrays and AND across dimensions; explicit null/empty arrays are invalid.
        Time bounds are inclusive lower and exclusive upper. Cursors bind normalized scope and page size.
        Concurrent commits and visibility/membership changes may alter traversal; refresh to find new activity.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListLeaseEventsRequest'}
      responses:
        '200':
          description: One page, including an empty events array when no visible history exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListLeaseEventsResponse'}
        '400':
          description: invalid_request or invalid_lease_event_page_token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {description: Authentication required}
        '403': {description: Permission denied, including delegated credentials}
        '404': {description: Explicit cell absent or inaccessible}
        '501':
          description: lease_events_unsupported (optional capability absent or collection disabled)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500': {description: Backend failure}
  /v1/tenants/{tenantId}/goals/query:
    post:
      tags: [jobs]
      operationId: listGoals
      description: Read-only discovery. Every page is scoped to the authorized tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListGoalsRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListGoalsResponse'}
  /v1/tenants/{tenantId}/dependency-waits/query:
    post:
      tags: [jobs]
      operationId: listDependencyWaits
      description: Read-only discovery. Every page is scoped to the authorized tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListDependencyWaitsRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDependencyWaitsResponse'}
  /v1/tenants/{tenantId}/goals/{goalId}:
    get:
      tags: [jobs]
      operationId: getGoal
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: goalId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalInfo'
  /v1/tenants/{tenantId}/goals/{goalId}/fail:
    post:
      tags: [jobs]
      operationId: failGoal
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: goalId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailGoalRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalInfo'
  /v1/tenants/{tenantId}/goals/{goalId}/candidates/{jobId}:
    put:
      tags: [jobs]
      operationId: addGoalCandidate
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: goalId
          in: path
          required: true
          schema: {type: string}
        - name: jobId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalCandidateInfo'
  /v1/tenants/{tenantId}/jobs/{jobId}/dependency-waits/{waitId}:
    get:
      tags: [jobs]
      operationId: getDependencyWait
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: {type: string}
        - name: jobId
          in: path
          required: true
          schema: {type: string}
        - name: waitId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyWaitInfo'
  /v1/tenants/{tenantId}/configuration:
    get:
      tags: [configuration]
      operationId: getTenantConfiguration
      summary: Read the complete tenant configuration
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        Uses administrative authorization, not lease authority. Empty tenants
        return a valid initial revision and values: {}.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Current snapshot
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/configuration/set:
    post:
      tags: [configuration]
      operationId: setTenantConfigurationValue
      summary: Set one tenant configuration value
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        Writes commit atomically. If-Match optionally requires one exact strong
        ETag for the whole tenant; mismatch returns 412 before mutation. No-op
        writes preserve revision, including removal of an absent name. A present
        JSON null is a value, not deletion. Duplicate JSON keys are rejected.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: header
          name: If-Match
          schema: {type: string}
          description: One quoted revision ETag; weak tags, lists and wildcard are invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConfigurationBody'
      responses:
        '204':
          description: Mutation committed
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Configuration revision mismatch
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/configuration/remove:
    post:
      tags: [configuration]
      operationId: removeTenantConfigurationValue
      summary: Remove one tenant configuration value
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        Writes commit atomically. If-Match optionally requires one exact strong
        ETag for the whole tenant; mismatch returns 412 before mutation. No-op
        writes preserve revision, including removal of an absent name. A present
        JSON null is a value, not deletion. Duplicate JSON keys are rejected.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: header
          name: If-Match
          schema: {type: string}
          description: One quoted revision ETag; weak tags, lists and wildcard are invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveConfigurationBody'
      responses:
        '204':
          description: Mutation committed
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Configuration revision mismatch
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{jobId}/leases/{leaseId}/configuration:
    get:
      tags: [configuration]
      operationId: getConfigurationWithLease
      summary: Read current tenant configuration using a live lease
      description: |
        Always registered on every backend. Each read returns a coherent current
        snapshot; no result caching, conditional GET, or pagination. All responses
        use Cache-Control: no-store. Deployment authentication also applies.
        The token must match tenant, job and lease. Current ownership and token
        expiry are checked before and after storage I/O. No requested-name list.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      responses:
        '200':
          description: Current snapshot
          headers:
            ETag:
              required: true
              schema: {type: string}
              description: Quoted tenant revision.
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
        '400':
          description: Invalid request
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Deployment authentication required
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Deployment authorization denied
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Execution lease lost
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Configuration exceeds limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Configuration operation failed or stored snapshot exceeds read limits
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Configuration temporarily unavailable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs:
    post:
      tags: [jobs]
      operationId: submitJob
      summary: Submit job
      description: |
        Submits a new job and writes the initial chapter (ordinal `0`). Any
        input artifacts are attached as part of that chapter creation. The
        server generates the job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{jobId}:
    put:
      tags: [jobs]
      operationId: putJob
      summary: Submit job with explicit job ID
      description: |
        Submits a new job with the path-supplied job ID and writes the initial
        chapter (ordinal `0`). This operation is idempotent for equivalent
        requests: when the job already exists with matching durable state, the
        runtime returns success; when the durable story exists but the internal
        runtime record is missing, the runtime repairs that record and returns
        success. If the existing job's durable state does not match the
        request, the runtime returns `409 existing_job_mismatch`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get job
      description: |
        Returns the current job status and a task-data view of the terminal
        payload when it is available. For non-terminal jobs, clients should
        treat an absent `data` value as a lazy `TaskData` that will surface the
        deferred runtime error when accessed.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
  /v1/tenants/{tenantId}/jobs/restarts:
    post:
      tags: [jobs]
      operationId: submitRestartJob
      summary: Submit restart job
      description: |
        Submits a restart derived from a prior run. Any `extraTaskInput` or
        `extraTaskOutput` artifacts are written as part of the restart chapter
        they belong to. The server generates the new job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job restart submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{jobId}/restart:
    put:
      tags: [jobs]
      operationId: putRestartJob
      summary: Submit restart job with explicit job ID
      description: |
        Submits a restart using the path-supplied destination job ID. This
        operation is idempotent for equivalent requests: when the target job
        already exists with the same copied restart prefix (and restart extra
        chapter when requested), the runtime returns success; when that durable
        state exists but the internal runtime record is missing, the runtime
        repairs that record and returns success. If the existing durable state
        does not match the request, the runtime returns
        `409 existing_job_mismatch`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Job restart submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs:
    post:
      tags: [leases]
      operationId: submitJobWithLease
      summary: Submit child job with lease
      description: |
        Submits a new child job while holding the identified parent job lease.
        The request body is the same shape as `submitJob`; the parent tenant is
        taken from the path and the server records the parent job ID in internal
        job metadata.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}:
    put:
      tags: [leases]
      operationId: putJobWithLease
      summary: Submit child job with explicit job ID and lease
      description: |
        Submits a new child job with the path-supplied child job ID while
        holding the identified parent job lease. Equivalent requests are
        idempotent using the same semantics as `putJob`, including the stored
        parent job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/ChildJobId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/restarts:
    post:
      tags: [leases]
      operationId: submitRestartJobWithLease
      summary: Submit child restart job with lease
      description: |
        Submits a restart child job while holding the identified parent job
        lease. The prior job tenant must match the path tenant when supplied.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child restart job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}/restart:
    put:
      tags: [leases]
      operationId: putRestartJobWithLease
      summary: Submit child restart job with explicit job ID and lease
      description: |
        Submits a restart child job with the path-supplied child job ID while
        holding the identified parent job lease. Equivalent requests are
        idempotent using the same semantics as `putRestartJob`, including the
        stored parent job ID.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ParentJobId'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/ChildJobId'
        - $ref: '#/components/parameters/LeaseTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRestartJobRequest'
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Child restart job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          description: Existing job does not match the requested durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tenants/{tenantId}/jobs/delete:
    post:
      tags: [jobs]
      operationId: deleteJobs
      summary: Delete jobs selected by age, IDs, and application metadata
      description: |
        Hides matching jobs from job and schedule-run listings and revokes leases.
        Unfinished jobs are cancelled and cannot be picked up again. Completed
        outcomes are preserved. Direct job reads remain available. All selectors intersect; jobIds are ORed.
        createdBefore is exclusive and uses job creation time, not completion time.
        Requires a selector or explicit all=true. No implicit child cascade.
        IDs continue to identify the same jobs. History, artifacts, and terminal dependency
        facts are retained for surviving references; this is not a storage purge.
        Raw chapter/artifact reads remain available. Dry runs only count matches
        and do not reserve the selection for a later request.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteJobsRequest'
      responses:
        '200':
          description: Atomic deletion or dry-run count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJobsResponse'
        '400':
          description: Invalid deletion selector
        '501':
          description: Backend does not implement job deletion
  /v1/tenants/{tenantId}/jobs/query:
    post:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs
      description: |
