openapi: 3.1.0
info:
  title: JobDB SQLite Development Secrets API
  version: 0.1.0
  description: |
    Development/prototype administration, automatically available in SQLite
    mode on the runtime listener. No admin or lease token is required.
    Any caller able to reach this API can set/remove tenant secrets.
    Not part of the portable JobDB runtime contract. Non-SQLite runtimes
    return 404. Unconfigured SQLite secret storage returns 503.
    Values are encrypted in a separate SQLite file. All responses use
    Cache-Control: no-store and never echo secret values.
servers:
  - url: http://127.0.0.1:9047
security: []
tags:
  - name: sqlite-development-secrets
    description: SQLite development/prototype use only
paths:
  /dev/v1/tenants/{tenantId}/secrets/set:
    post:
      operationId: setDevSecret
      tags: [sqlite-development-secrets]
      summary: Add or replace a tenant secret
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, value]
              properties:
                name: {type: string, minLength: 1}
                value:
                  type: string
                  description: UTF-8 value, including empty strings and exact newlines
      responses:
        '204':
          description: Value committed; no body
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        default:
          $ref: '#/components/responses/Error'
  /dev/v1/tenants/{tenantId}/secrets/remove:
    post:
      operationId: removeDevSecret
      tags: [sqlite-development-secrets]
      summary: Remove a tenant secret, succeeding if already absent
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1}
      responses:
        '204':
          description: Removal committed or entry already absent; no body
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    Error:
      description: |
        Sanitized error without values or raw storage diagnostics.
        400 invalid_secret_request; 413 secret_request_too_large;
        503 dev_secrets_not_configured or secrets_unavailable;
        500 secret_resolution_failed.
        Default body limits: set 1 MiB, remove 64 KiB. Configurable through
        SQLite SecretLimits.MaxResponseBytes and MaxRequestBytes respectively.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
