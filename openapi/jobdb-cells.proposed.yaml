openapi: 3.1.0
info:
  title: JobDB Cell API proposal
  version: 0.6.0-proposed
  summary: Named cell registry and root-authorized implicit registration during job submission
  description: 'Proposed, not implemented. See docs/SPEC-Tenant-Cells.md. JobDB owns the

    name-to-repository registry. c2j submits required job.cell names and supplies

    job.cellRepo when a cell is missing. JobDB resolves names to generated IDs;

    job IDs remain tenant-wide. Root owner leases may submit into any cell in the

    same tenant and implicitly register missing cells with a supplied repository.

    Delegation attenuation still applies. There is no separate creation lease

    capability or ensure operation.


    This draft defines cell management and revised ordinary/leased submissions.

    Unchanged job payloads reference jobdb-runtime.yaml. Related runtime surfaces

    must adopt cell ownership as described in the design before implementation.

    Cells retire rather than delete. Repository locators require no combined Git

    server, provider ID lookup, or network call at registration time.

    x-jobdb-authorization documents required enforcement, not an authorizer.

    Cell management responses use Cache-Control: no-store.


    Hard-break release: fresh execution storage; discard all pre-change jobs,

    history/artifacts, goals, schedules, reservations, lease/delegation state, and

    cursors. No metadata backfill, old-job replay, compatibility decoder, dual API,

    or mixed-version runtime is supported. Required fields apply immediately.

    Rename aliases and retained retired-cell history concern only new-format cells

    and jobs created after this cutover. Replace old implementations outright.


    Project adoption plans: docs/GUIDE-C2J-CELLS.md, docs/GUIDE-CORTEX-CELLS.md,

    docs/GUIDE-PGJOBDB-CELLS.md, and docs/GUIDE-RECIPES-CELLS.md. This proposal slice

    must be merged with the full runtime contract before shipping; it is not a

    parallel API for compatibility.'
servers:
- url: https://jobdb-runtime.example.com
tags:
- name: cells
  description: Tenant cell administration and authorized discovery.
- name: jobs
  description: Job submission with a required cell name.
- name: leases
  description: Live-lease submission with root or ordinary target scope.
security:
- bearerAuth: []
paths:
  /v1/tenants/{tenantId}/cells:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - cells
      operationId: listCells
      summary: List visible cells in a tenant
      description: 'Requires tenant access and cells.list; include only cells visible under cells.get.

        Filter name matches the current name or a permanent alias, yielding zero or one

        visible result. state defaults to ACTIVE; ALL includes retired records. Apply

        all filters and visibility before pagination. isRoot queries the server binding.


        Sort by immutable ID, with no unfiltered counts. Use cells: [] for empty results

        and omit nextPageToken at the end. Tokens bind tenant, principal, and repeated

        filters; recheck authorization each page. Traversal is live, not a snapshot.

        Read/name lookup never creates a cell. c2j can submit directly by name without

        a preceding lookup; the runtime performs authoritative resolution.'
      x-jobdb-authorization:
        permission: cells.list
        resource: tenant
        itemPermission: cells.get
      parameters:
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/IsRootFilter'
      - $ref: '#/components/parameters/StateFilter'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Authorized page, possibly empty.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCellsResponse'
              example:
                cells:
                - tenantId: acme
                  description: Customer-facing workloads
                  createdAt: '2026-11-03T20:00:00Z'
                  metadata:
                    team: payments
                    environment: prod
                  isRoot: false
                  revision: r1
                  updatedAt: '2026-11-03T20:00:00Z'
                  id: cell_019d03e9-066b-76b3-9b46-47d306b0aa1f
                  state: ACTIVE
                  name: payments
                  repo: github.com/colony-2/payments
                  aliases: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - cells
      operationId: createCell
      summary: Create a cell with a generated immutable ID
      description: 'Requires tenant cells.create. Register a name and canonical repository locator;

        no Git API/network verification or repository creation occurs. Name/aliases and

        canonical repo must be unique within the tenant across active and retired cells.

        Conflicts return 409 cell_conflict with no mutation. Atomically generate the ID,

        initialize ACTIVE state, and persist properties. Creating name root additionally

        requires trusted cells.bootstrapRoot authority and atomically records rootCellId.

        Clients cannot supply isRoot or select the ID.


        Optional requestId is scoped to tenant and authenticated principal. Persist

        normalized creation properties and original result for the cell lifetime.

        Matching replay rechecks authority and retirement (409 cell_retired), then returns

        the original snapshot/ETag, possibly stale. Different properties return 409

        request_conflict. Omitted description/metadata normalize to empty string/{}.

        Without requestId, POST is not idempotent. Root job-submission leases do not

        by themselves authorize this administrative endpoint.


        The jobdb cell create-root command uses this endpoint with fixed name root.

        It never renames or repoints an existing root. CLI retries may confirm a matching

        existing root through authorized lookup; this does not change POST idempotency.'
      x-jobdb-authorization:
        permission: cells.create
        resource: tenant
        rootBootstrapPermission: cells.bootstrapRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCellRequest'
            example:
              name: payments
              repo: github.com/colony-2/payments
              description: Payments workloads
              metadata:
                team: payments
              requestId: provision-payments-001
      responses:
        '201':
          description: Cell created, or original successful response replayed for the same requestId.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              description: Relative URI of the created cell, with encoded path segments.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /v1/tenants/acme/cells/cell_019d03e9-066b-76b3-9b46-47d306b0aa1f
            ETag:
              $ref: '#/components/headers/CellETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cell'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenantId}/cells/{cellId}:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - $ref: '#/components/parameters/CellId'
    get:
      tags:
      - cells
      operationId: getCell
      summary: Read one visible cell
      description: 'Requires tenant access and cells.get. Missing and inaccessible cells both

        return 404. Retired cells remain readable. Return the current record and ETag.

        This permission grants no workload access; reads never provision cells.'
      x-jobdb-authorization:
        permission: cells.get
        resource: cell
      responses:
        '200':
          $ref: '#/components/responses/CellResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - cells
      operationId: updateCell
      summary: Change cell name, repo, description, or metadata
      description: 'Requires cells.get and cells.update; authorize before preconditions/conflicts.

        Require a strong current If-Match: missing 428, stale 412, malformed 400.

        Only active cells can change. Omitted properties remain unchanged; metadata

        replaces the whole map ({} clears it) and empty description clears it. Metadata

        values may be arbitrary JSON, including nested objects, arrays, and null. This

        is typed application/json PATCH, not JSON Merge Patch. Empty patches, null

        top-level fields, and server-owned fields are invalid.


        Rename reserves the old name as a permanent alias for this ID. Current names

        and aliases must be unique within the tenant, including retired cells. Rename

        to the cell''s own alias is allowed; remove the new current name from aliases.

        The reserved root name cannot be claimed by another cell or changed on root

        (409 root_cell_protected). Supplying name root on root is an allowed no-op.

        Root repo/description/metadata can be updated by an authorized administrator.

        Root ID and designation are immutable; root cannot retire.


        Normalize repo using the registration contract and enforce unique current repo

        within the tenant, including retired cells. Repointing releases the former repo

        locator for reuse. No Git operations, credential changes, or idle-cell check

        occur. Existing jobs retain their submitted repo snapshots for leases, execution,

        retry/replay, and restart. Fresh submissions resolve the new mapping and must

        serialize with PATCH; obsolete repo assertions fail with cell_repo_mismatch.

        Schedules retain expected repo and pause on mismatch until explicitly updated.


        Atomically validate all properties, revision, root protection, and uniqueness;

        any failure rejects the entire PATCH. A no-op, including an equivalent normalized

        repo, preserves revision/time; otherwise advance both. Updates never change job

        ownership. Conflict returns 409 cell_conflict, retired target 409 cell_retired.'
      x-jobdb-authorization:
        permissions:
        - cells.get
        - cells.update
        resource: cell
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCellRequest'
            example:
              name: payments-prod
              metadata:
                team: payments
                environment: prod
              repo: github.com/colony-2/payments-service
      responses:
        '200':
          $ref: '#/components/responses/CellResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenantId}/cells/{cellId}/retire:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - $ref: '#/components/parameters/CellId'
    post:
      tags:
      - cells
      operationId: retireCell
      summary: Retire an idle cell while retaining its identity and history
      description: 'Requires cells.get and cells.retire, and current strong If-Match (missing 428,

        stale 412, malformed 400). Root cannot retire (409 root_cell_protected).

        Atomically require no nonterminal jobs (including hidden/waiting/retrying), live

        leases, active schedules, open goals, or pending submission reservations;

        otherwise 409 cell_busy, without cancelling or draining work.


        Serialize against submission/registration, scheduling, and acquisition. Set

        RETIRED state and server retiredAt/updatedAt and advance revision. Preserve ID,

        name/aliases, repo, metadata, jobs, and artifacts. Authorized reads continue.

        All new work, acquisitions, schedule changes, and cell updates are denied.

        Existing-job idempotent confirmation may return the already committed job after

        current authorization checks; it creates no new work. There is no delete or

        automatic resurrection. A repeat with current ETag returns the retired record;

        an old ETag returns 412. Retirement has no Git archive/delete side effect.'
      x-jobdb-authorization:
        permissions:
        - cells.get
        - cells.retire
        resource: cell
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/CellResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetirementConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenantId}/jobs:
    post:
      tags:
      - jobs
      operationId: submitJob
      summary: Submit job
      description: "Require job.cell on every submission. Authorize target scope before disclosing\nregistry\
        \ state. Resolve current names and permanent aliases to stored cell IDs.\nFor an active target,\
        \ omitted cellRepo uses the stored repo; supplied repo must\nnormalize to it (409 cell_repo_mismatch\
        \ otherwise). For a missing ordinary name,\nrequire cellRepo (400 cell_repo_required) and registration\
        \ authority, then\natomically create the cell and submit the job. A repo already bound to another\n\
        cell conflicts; never infer a rename. Missing root requires trusted bootstrap\n(409 root_cell_required).\
        \ Retired targets reject new work (409 cell_retired).\n\nValidate the complete job before publication.\
        \ Cell, job, initial chapter, goal,\nand idempotency ownership must publish atomically. Invalid\
        \ data or loss of parent\nlease before commit leaves neither a job nor a new cell. Concurrent\
        \ matching\nname/repo submissions converge on one cell; conflicting repos return 409.\nNo Git\
        \ API/network calls or repository creation occur. Return current canonical\ncell name, generated\
        \ ID, and the job's submitted repo snapshot in the job handle.\n        Capture the repo atomically\
        \ with publication and serialize against repo PATCH;\n        existing jobs retain their snapshots\
        \ after a registry repo edit.\n\nAdministrative submit authority applies to the target. Missing-cell\
        \ registration\nalso requires tenant cells.create. Submitting into root requires administrative\n\
        root execution authority; registering a cell never grants Git access.\n\nThe server generates\
        \ the job ID. POST retains its non-idempotent job semantics; use explicit-ID PUT for retry-safe\
        \ submission."
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
            example:
              job:
                cell: payments
                cellRepo: github.com/colony-2/payments
                jobType: recipe
                data:
                  data: {}
                  artifacts: []
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: ./jobdb-runtime.yaml#/components/schemas/ErrorResponse
        '200':
          description: Job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '400':
          $ref: '#/components/responses/SubmissionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-jobdb-authorization:
        permission: jobs.submit
        target: resolved cell
        missingCellCreation: root parent lease or administrative cells.create
  /v1/tenants/{tenantId}/jobs/{jobId}:
    put:
      tags:
      - jobs
      operationId: putJob
      summary: Submit job with explicit job ID
      description: "Require job.cell on every submission. Authorize target scope before disclosing\nregistry\
        \ state. Resolve current names and permanent aliases to stored cell IDs.\nFor an active target,\
        \ omitted cellRepo uses the stored repo; supplied repo must\nnormalize to it (409 cell_repo_mismatch\
        \ otherwise). For a missing ordinary name,\nrequire cellRepo (400 cell_repo_required) and registration\
        \ authority, then\natomically create the cell and submit the job. A repo already bound to another\n\
        cell conflicts; never infer a rename. Missing root requires trusted bootstrap\n(409 root_cell_required).\
        \ Retired targets reject new work (409 cell_retired).\n\nValidate the complete job before publication.\
        \ Cell, job, initial chapter, goal,\nand idempotency ownership must publish atomically. Invalid\
        \ data or loss of parent\nlease before commit leaves neither a job nor a new cell. Concurrent\
        \ matching\nname/repo submissions converge on one cell; conflicting repos return 409.\nNo Git\
        \ API/network calls or repository creation occur. Return current canonical\ncell name, generated\
        \ ID, and the job's submitted repo snapshot in the job handle.\n        Capture the repo atomically\
        \ with publication and serialize against repo PATCH;\n        existing jobs retain their snapshots\
        \ after a registry repo edit.\n\nAdministrative submit authority applies to the target. Missing-cell\
        \ registration\nalso requires tenant cells.create. Submitting into root requires administrative\n\
        root execution authority; registering a cell never grants Git access.\n\nFor explicit job IDs,\
        \ first inspect the existing tenant-wide job key. Store and\ncompare original submission/parent\
        \ data with resolved cell identity. Identical\nretries recheck current authority and confirm the\
        \ existing job without re-routing\nor creating a cell. A current name or alias of the same stored\
        \ ID is equivalent;\nomitted repo and explicit matching snapshot repo are equivalent. Compare\
        \ against\n        the stored job snapshot before current registry repo resolution, including\
        \ after\n        repo PATCH. Changed identity, repo,\nparent, or ordinary job data returns 409\
        \ existing_job_mismatch. A committed job\nin a retired cell may be confirmed under current read/confirmation\
        \ authority;\nlease callers also need a valid parent lease and sufficient submission scope.\n\
        Existing durable-state recovery must preserve stored cell ownership."
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
            example:
              job:
                cell: payments
                cellRepo: github.com/colony-2/payments
                jobType: recipe
                data:
                  data: {}
                  artifacts: []
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: ./jobdb-runtime.yaml#/components/schemas/ErrorResponse
        '200':
          description: Job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '400':
          $ref: '#/components/responses/SubmissionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-jobdb-authorization:
        permission: jobs.submit
        target: resolved cell
        missingCellCreation: root parent lease or administrative cells.create
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs:
    post:
      tags:
      - leases
      operationId: submitJobWithLease
      summary: Submit child job with lease
      description: "Require job.cell on every submission. Authorize target scope before disclosing\nregistry\
        \ state. Resolve current names and permanent aliases to stored cell IDs.\nFor an active target,\
        \ omitted cellRepo uses the stored repo; supplied repo must\nnormalize to it (409 cell_repo_mismatch\
        \ otherwise). For a missing ordinary name,\nrequire cellRepo (400 cell_repo_required) and registration\
        \ authority, then\natomically create the cell and submit the job. A repo already bound to another\n\
        cell conflicts; never infer a rename. Missing root requires trusted bootstrap\n(409 root_cell_required).\
        \ Retired targets reject new work (409 cell_retired).\n\nValidate the complete job before publication.\
        \ Cell, job, initial chapter, goal,\nand idempotency ownership must publish atomically. Invalid\
        \ data or loss of parent\nlease before commit leaves neither a job nor a new cell. Concurrent\
        \ matching\nname/repo submissions converge on one cell; conflicting repos return 409.\nNo Git\
        \ API/network calls or repository creation occur. Return current canonical\ncell name, generated\
        \ ID, and the job's submitted repo snapshot in the job handle.\n        Capture the repo atomically\
        \ with publication and serialize against repo PATCH;\n        existing jobs retain their snapshots\
        \ after a registry repo edit.\n\nValidate signed token/path binding, tenant, liveness, deadline,\
        \ and attenuation.\nLoad the parent cell from stored ownership. A root owner lease grants jobs.submit\n\
        to any cell name in this tenant and implicit registration when repo is supplied;\nthere is no\
        \ separate cells.create lease permission. A delegated root lease still\nneeds jobs.submit and\
        \ must satisfy every job-type/job-ID/cellNames restriction.\nNon-root leases default to their\
        \ own cell; explicit target grants may authorize\nother existing cells but cannot implicitly register\
        \ missing cells. A child later\nacquired in a non-root cell gets ordinary cell authority, not\
        \ inherited root\npower. Job metadata/context cannot establish root authority.\n\nThe server generates\
        \ the job ID. POST retains its non-idempotent job semantics; use explicit-ID PUT for retry-safe\
        \ submission."
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ParentJobId'
      - $ref: '#/components/parameters/LeaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
            example:
              job:
                cell: payments
                cellRepo: github.com/colony-2/payments
                jobType: recipe
                data:
                  data: {}
                  artifacts: []
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: ./jobdb-runtime.yaml#/components/schemas/ErrorResponse
        '200':
          description: Child job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '400':
          $ref: '#/components/responses/SubmissionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        leaseToken: []
      x-jobdb-authorization:
        permission: jobs.submit
        target: resolved cell
        missingCellCreation: root parent lease or administrative cells.create
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/jobs/{childJobId}:
    put:
      tags:
      - leases
      operationId: putJobWithLease
      summary: Submit child job with explicit job ID and lease
      description: "Require job.cell on every submission. Authorize target scope before disclosing\nregistry\
        \ state. Resolve current names and permanent aliases to stored cell IDs.\nFor an active target,\
        \ omitted cellRepo uses the stored repo; supplied repo must\nnormalize to it (409 cell_repo_mismatch\
        \ otherwise). For a missing ordinary name,\nrequire cellRepo (400 cell_repo_required) and registration\
        \ authority, then\natomically create the cell and submit the job. A repo already bound to another\n\
        cell conflicts; never infer a rename. Missing root requires trusted bootstrap\n(409 root_cell_required).\
        \ Retired targets reject new work (409 cell_retired).\n\nValidate the complete job before publication.\
        \ Cell, job, initial chapter, goal,\nand idempotency ownership must publish atomically. Invalid\
        \ data or loss of parent\nlease before commit leaves neither a job nor a new cell. Concurrent\
        \ matching\nname/repo submissions converge on one cell; conflicting repos return 409.\nNo Git\
        \ API/network calls or repository creation occur. Return current canonical\ncell name, generated\
        \ ID, and the job's submitted repo snapshot in the job handle.\n        Capture the repo atomically\
        \ with publication and serialize against repo PATCH;\n        existing jobs retain their snapshots\
        \ after a registry repo edit.\n\nValidate signed token/path binding, tenant, liveness, deadline,\
        \ and attenuation.\nLoad the parent cell from stored ownership. A root owner lease grants jobs.submit\n\
        to any cell name in this tenant and implicit registration when repo is supplied;\nthere is no\
        \ separate cells.create lease permission. A delegated root lease still\nneeds jobs.submit and\
        \ must satisfy every job-type/job-ID/cellNames restriction.\nNon-root leases default to their\
        \ own cell; explicit target grants may authorize\nother existing cells but cannot implicitly register\
        \ missing cells. A child later\nacquired in a non-root cell gets ordinary cell authority, not\
        \ inherited root\npower. Job metadata/context cannot establish root authority.\n\nFor explicit\
        \ job IDs, first inspect the existing tenant-wide job key. Store and\ncompare original submission/parent\
        \ data with resolved cell identity. Identical\nretries recheck current authority and confirm the\
        \ existing job without re-routing\nor creating a cell. A current name or alias of the same stored\
        \ ID is equivalent;\nomitted repo and explicit matching snapshot repo are equivalent. Compare\
        \ against\n        the stored job snapshot before current registry repo resolution, including\
        \ after\n        repo PATCH. Changed identity, repo,\nparent, or ordinary job data returns 409\
        \ existing_job_mismatch. A committed job\nin a retired cell may be confirmed under current read/confirmation\
        \ authority;\nlease callers also need a valid parent lease and sufficient submission scope.\n\
        Existing durable-state recovery must preserve stored cell ownership."
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ParentJobId'
      - $ref: '#/components/parameters/LeaseId'
      - $ref: '#/components/parameters/ChildJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
            example:
              job:
                cell: payments
                cellRepo: github.com/colony-2/payments
                jobType: recipe
                data:
                  data: {}
                  artifacts: []
      responses:
        '413':
          description: Chapter application payload exceeds the configured byte budget
          content:
            application/json:
              schema:
                $ref: ./jobdb-runtime.yaml#/components/schemas/ErrorResponse
        '200':
          description: Child job submitted or confirmed/recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHandle'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
        '400':
          $ref: '#/components/responses/SubmissionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        leaseToken: []
      x-jobdb-authorization:
        permission: jobs.submit
        target: resolved cell
        missingCellCreation: root parent lease or administrative cells.create
  /v1/tenants/{tenantId}/jobs/{parentJobId}/leases/{leaseId}/cells/resolve:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - $ref: '#/components/parameters/ParentJobId'
    - $ref: '#/components/parameters/LeaseId'
    post:
      operationId: resolveCellWithLease
      tags:
      - leases
      summary: Resolve an active cell name within lease submission scope
      security:
      - bearerAuth: []
        leaseToken: []
      description: 'Read-only. Verify the signed live lease, path binding, attenuation, and deadline.

        Require effective jobs.submit authority and target-cell scope. Root owner scope

        covers all tenant names; ordinary scope covers its own cell unless explicitly

        granting more targets. A delegation without jobs.submit cannot resolve targets.

        Return canonical cell name, immutable ID, and registered repo only. This supports

        name-only c2j requests that must load a recipe before job submission. It grants

        no cell metadata, job history, or secret access. Job-type/job-ID restrictions

        remain checked at submission; resolution cannot expand them.


        Missing or inaccessible names return 404. An authorized retired cell returns

        409 cell_retired. Current names and reserved aliases resolve to the same ID.

        No registration, job creation, Git network call, or policy mutation occurs.

        Subsequent submission must recheck authority, repo assertion, and active state.'
      x-jobdb-authorization:
        permission: jobs.submit
        target: effective submission cell scope
        effect: bounded name/ID/repo resolution only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCellRequest'
            example:
              cell: payments
      responses:
        '200':
          description: Minimal active cell identity and repository.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedCell'
              example:
                cell: payments
                cellId: cell_019d03e9-066b-76b3-9b46-47d306b0aa1f
                cellRepo: github.com/colony-2/payments
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResolveConflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Deployment-authenticated principal; no token encoding is prescribed.
    leaseToken:
      type: apiKey
      in: header
      name: X-JobDB-Lease-Token
      description: Signed live parent lease, bound to URL identity. Root owner leases grant submission
        to any tenant cell including implicit registration. Non-root ceilings and delegation attenuation
        remain enforced. The release rejects pre-change lease/delegation formats; only the new ownership-bound
        profile is accepted.
  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
    CellETag:
      description: Strong ETag containing the quoted opaque revision. Creation replay returns the original
        revision, possibly stale.
      required: true
      schema:
        type: string
      example: '"r1"'
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Existing tenant identity; access must be checked before cell lookup.
      schema:
        type: string
        minLength: 1
    CellId:
      name: cellId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CellId'
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      description: Maximum visible records; may change between pages.
    PageToken:
      name: pageToken
      in: query
      schema:
        type: string
        minLength: 1
      description: 'Opaque continuation bound to tenant, authenticated principal, and filters

        (excluding pageSize). Repeat the same filters on each page. Integrity-protected;

        not an authorization grant. Invalid, expired, or mismatched tokens return

        400 invalid_page_token. Current authorization is rechecked on every page.'
    IsRootFilter:
      name: isRoot
      in: query
      description: Filter on the stored rootCellId binding, independently of display name.
      schema:
        type: boolean
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'Exactly one strong ETag from a cell response. Missing: 428; stale: 412; weak, wildcard,
        or list: 400.'
      schema:
        type: string
        minLength: 3
      example: '"r1"'
    StateFilter:
      name: state
      in: query
      description: Lifecycle filter. ALL includes retired cells for history and name lookup.
      schema:
        type: string
        enum:
        - ACTIVE
        - RETIRED
        - ALL
        default: ACTIVE
    ParentJobId:
      name: parentJobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NameFilter:
      name: name
      in: query
      description: Exact current name or permanent alias. Resolves at most one visible cell. Use state=ALL
        for retired lookup.
      schema:
        $ref: '#/components/schemas/CellName'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ChildJobId:
      name: childJobId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CellId:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque server-generated stable identity. JobDB resolves names to this ID and stores
        it on owned resources. c2j may use names for submission and ignore the ID until needed.
      examples:
      - cell_019d03e9-066b-76b3-9b46-47d306b0aa1f
    CreateCellRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - repo
      description: Administrative registration; name and repo required. description and metadata default
        to empty values. The server assigns ID/root designation. Root bootstrap additionally requires
        cells.bootstrapRoot authority.
      properties:
        description:
          type: string
          maxLength: 2048
        metadata:
          $ref: '#/components/schemas/CellMetadata'
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional idempotency identifier, scoped to tenant and authenticated principal.
            Retained for the cell lifetime; not its cellId.
        name:
          $ref: '#/components/schemas/CellName'
        repo:
          $ref: '#/components/schemas/CellRepo'
    Cell:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - id
      - name
      - description
      - metadata
      - isRoot
      - revision
      - createdAt
      - updatedAt
      - repo
      - state
      - aliases
      properties:
        tenantId:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 2048
        createdAt:
          type: string
          format: date-time
          description: Server-assigned creation timestamp, returned in UTC with Z offset.
          readOnly: true
        metadata:
          $ref: '#/components/schemas/CellMetadata'
        isRoot:
          type: boolean
          readOnly: true
          description: Server-owned root designation; exactly one per tenant. Its name is permanently
            root; root bootstrap is administrative.
        revision:
          type: string
          minLength: 1
          readOnly: true
          description: Opaque version; use the quoted ETag for conditional updates.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Server mutation timestamp in UTC; initially equals createdAt.
        id:
          $ref: '#/components/schemas/CellId'
        state:
          $ref: '#/components/schemas/CellState'
          readOnly: true
        retiredAt:
          type: string
          format: date-time
          readOnly: true
          description: Server UTC retirement time; present only for RETIRED cells.
        name:
          $ref: '#/components/schemas/CellName'
        repo:
          $ref: '#/components/schemas/CellRepo'
          description: Current registered repository locator; editable through authorized PATCH. Existing
            jobs keep their submission snapshots.
        aliases:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CellName'
          readOnly: true
          description: Permanent former names from renames of cells created after the hard break, resolving
            to this ID. Excludes current name. No imported legacy aliases; no removal/reassignment through
            this API.
      allOf:
      - if:
          properties:
            state:
              const: RETIRED
        then:
          required:
          - retiredAt
        else:
          not:
            required:
            - retiredAt
    ListCellsResponse:
      type: object
      additionalProperties: false
      required:
      - cells
      properties:
        cells:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Cell'
        nextPageToken:
          type: string
          minLength: 1
          description: Omitted on the last page; never null or an empty string.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - invalid_page_token
          - unauthorized
          - forbidden
          - not_found
          - cell_conflict
          - cell_repo_required
          - cell_repo_mismatch
          - cell_retired
          - cell_busy
          - root_cell_protected
          - root_cell_required
          - request_conflict
          - existing_job_mismatch
          - precondition_failed
          - precondition_required
          - execution_lease_lost
          - lease_permission_denied
          - internal
        message:
          type: string
          description: Human-readable explanation without inaccessible resource details.
    JsonValue:
      description: Application-owned JSON value.
      oneOf:
      - type: 'null'
      - type: boolean
      - type: number
      - type: string
      - type: array
        items:
          $ref: '#/components/schemas/JsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JsonValue'
    CellMetadata:
      type: object
      maxProperties: 64
      propertyNames:
        minLength: 1
        maxLength: 128
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
      description: Application properties, at most 16 KiB encoded as compact UTF-8 JSON (enforced by server).
        No authorization semantics. PATCH replaces the whole object.
      examples:
      - team: payments
        environment: prod
    UpdateCellRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 2048
        metadata:
          $ref: '#/components/schemas/CellMetadata'
        name:
          $ref: '#/components/schemas/CellName'
        repo:
          $ref: '#/components/schemas/CellRepo'
      description: Mutable properties of an active cell. Omitted fields are preserved; supplied metadata
        replaces the map. Root name must remain root. All changes commit atomically with If-Match.
    CellState:
      type: string
      enum:
      - ACTIVE
      - RETIRED
    CellName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
      not:
        enum:
        - .
        - ..
      description: Tenant-unique case-sensitive name. Current names and permanent former-name aliases
        share uniqueness, including retired cells. Exact lowercase root is reserved for trusted bootstrap.
      examples:
      - root
      - payments
      - payments-prod
    CellRepo:
      type: string
      minLength: 1
      maxLength: 2048
      description: 'Credential-free repository locator. Accept recognized host/owner/repo, HTTPS,

        and standard-port SSH/SCP forms. Canonicalize to lowercase-host/repository-path,

        preserving path case and removing one .git suffix and trailing slash. Ignore

        SSH transport username. Reject HTTP credentials, query/fragment components,

        empty/traversing paths, unsupported custom transports/ports, and local paths.

        Deployment-managed aliases can map otherwise unsupported locators to a shared

        canonical identity. Do not guess equivalence. No network/provider validation

        is performed. Cells return the canonical form, e.g. github.com/colony-2/payments.

        Git clone transport and authentication are separate c2j configuration.'
      examples:
      - github.com/colony-2/payments
      - https://github.com/colony-2/payments.git
      - git@github.com:colony-2/payments.git
    SubmitJob:
      type: object
      required:
      - jobType
      - data
      - cell
      additionalProperties: false
      properties:
        dependencies:
          type: array
          items:
            $ref: ./jobdb-runtime.yaml#/components/schemas/Dependency
        clientPayloadUpdate:
          $ref: ./jobdb-runtime.yaml#/components/schemas/ClientPayloadUpdate
        jobType:
          type: string
        data:
          $ref: ./jobdb-runtime.yaml#/components/schemas/TaskDataWrite
        runPolicy:
          $ref: ./jobdb-runtime.yaml#/components/schemas/RunPolicy
        metadata:
          $ref: ./jobdb-runtime.yaml#/components/schemas/Metadata
        schema:
          $ref: ./jobdb-runtime.yaml#/components/schemas/JobSchemaSelector
        prerequisites:
          type: array
          items:
            $ref: ./jobdb-runtime.yaml#/components/schemas/JobPrerequisite
        availableAt:
          type: string
          format: date-time
        cell:
          $ref: '#/components/schemas/CellName'
        cellRepo:
          $ref: '#/components/schemas/CellRepo'
      description: 'cell is required, including self/lease-scoped submissions. It names the target

        cell or a reserved alias. cellRepo is optional for an existing cell but required

        at runtime when the name is absent. An explicit repo on an existing cell must

        normalize to its registered repo. Cell creation initializes empty cell metadata;

        this job metadata is never cell metadata or ownership authority.'
    SubmitJobRequest:
      type: object
      required:
      - job
      additionalProperties: false
      properties:
        job:
          $ref: '#/components/schemas/SubmitJob'
        workerId:
          type: string
        requestTime:
          type: string
          format: date-time
    JobHandle:
      type: object
      required:
      - goalId
      - jobKey
      - cell
      - cellId
      - cellRepo
      additionalProperties: false
      properties:
        goalId:
          type: string
        jobKey:
          $ref: ./jobdb-runtime.yaml#/components/schemas/JobKey
        cell:
          $ref: '#/components/schemas/CellName'
        cellId:
          $ref: '#/components/schemas/CellId'
        cellRepo:
          $ref: '#/components/schemas/CellRepo'
          description: Repo snapshot captured on job submission; may differ from the cell's current registry
            repo.
      description: Existing job handle plus current canonical cell name, stable cell ID, and the job's
        immutable submitted repo snapshot. The submitted name is persisted separately for history/idempotency.
        Registry repo edits do not rewrite this snapshot.
    CellNameSelector:
      description: Optional attenuation of target-cell scope. Omission inherits the parent ceiling. any:true
        never expands a non-root ceiling. Names include current names or reserved aliases; an empty names
        list denies all targets.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - any
        properties:
          any:
            type: boolean
            const: true
      - type: object
        additionalProperties: false
        required:
        - names
        properties:
          names:
            type: array
            uniqueItems: true
            maxItems: 256
            items:
              $ref: '#/components/schemas/CellName'
    DelegationSubmitPermission:
      type: object
      additionalProperties: false
      required:
      - jobTypes
      - jobIds
      properties:
        jobTypes:
          $ref: ./jobdb-runtime.yaml#/components/schemas/DelegationNames
        jobIds:
          $ref: ./jobdb-runtime.yaml#/components/schemas/DelegationNames
        cellNames:
          $ref: '#/components/schemas/CellNameSelector'
      description: Proposed jobs.submit delegation shape. Root owner ceiling spans every tenant cell and
        permits registration through submission; ordinary ceiling is its own cell unless explicitly broadened.
        Missing jobs.submit denies submission. Existing jobTypes/jobIds and all ancestor restrictions
        still apply; omitted cellNames inherits target scope.
    ResolveCellRequest:
      type: object
      additionalProperties: false
      required:
      - cell
      properties:
        cell:
          $ref: '#/components/schemas/CellName'
    ResolvedCell:
      type: object
      additionalProperties: false
      required:
      - cell
      - cellId
      - cellRepo
      properties:
        cell:
          $ref: '#/components/schemas/CellName'
        cellId:
          $ref: '#/components/schemas/CellId'
        cellRepo:
          $ref: '#/components/schemas/CellRepo'
      description: Minimal active target information for loading a recipe/submitting a job. It grants
        no history, metadata, or secret access.
  responses:
    CellResult:
      description: Cell record and ETag. Matching create-request replay returns the original snapshot
        only while the cell remains active; use GET for current state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        ETag:
          $ref: '#/components/headers/CellETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cell'
    BadRequest:
      description: invalid_request for invalid input, or invalid_page_token for a rejected cursor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: unauthorized; authentication is missing or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          required: true
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: forbidden for denied administration/target/creation authority; lease_permission_denied
        for an attenuated or non-root lease lacking the required target submission scope. Inaccessible
        existing targets are concealed as 404 where applicable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: not_found; tenant or cell is absent or inaccessible, without distinguishing these cases.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_found
            message: Resource not found.
    InternalError:
      description: internal; unexpected server failure without implementation details.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: cell_conflict for a reserved name/alias/repo; request_conflict for requestId reuse;
        cell_retired for active-only mutation/replay; root_cell_protected for attempted root rename. No
        partial change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: precondition_failed; If-Match does not match the current revision. No mutation occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: precondition_required; supply If-Match with a current strong ETag. No mutation occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RetirementConflict:
      description: cell_busy for unfinished work/live leases/active schedules/open goals/pending reservations,
        or root_cell_protected. No state change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubmissionBadRequest:
      description: invalid_request for invalid input or missing cell name; cell_repo_required when target
        cell does not exist and cellRepo is absent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubmissionConflict:
      description: cell_repo_mismatch for an existing-cell repo assertion mismatch; cell_conflict for
        reserved name/alias/repo; cell_retired for new work in a retired cell; root_cell_required for
        missing root; existing_job_mismatch for changed explicit-ID job; execution_lease_lost for expired/replaced
        parent lease.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResolveConflict:
      description: cell_retired for an authorized retired target, or execution_lease_lost when the parent
        is no longer live. No mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
