syntax = "proto3";
package jobdb.secrets.plugin.v1;
option go_package = "github.com/colony-2/jobdb/pkg/jobdb/secrets/plugin/proto/v1;secretpb";
import "google/protobuf/timestamp.proto";

service SecretProvider {
  rpc ResolveSecrets(ResolveRequest) returns (ResolveReply);
}
message LeaseContext {
  string lease_id = 1;
  string worker_id = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
  google.protobuf.Timestamp authorized_not_after = 4;
}
message ResolveRequest {
  string tenant_id = 1;
  string job_id = 2;
  optional string principal = 3;
  bytes app_metadata_json = 4;
  repeated string names = 5;
  LeaseContext lease = 6;
}
message SecretValue {
  optional string value = 1;
  string version = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool lease_bound = 4;
}
message ResolveResult { map<string, SecretValue> secrets = 1; }
enum Failure {
  FAILURE_UNSPECIFIED = 0;
  FAILURE_UNAVAILABLE = 1;
  FAILURE_RESOLUTION_FAILED = 2;
  FAILURE_INVALID_REQUEST = 3;
  FAILURE_REQUEST_TOO_LARGE = 4;
  FAILURE_NO_PROVIDER = 5;
  FAILURE_LEASE_LOST = 6;
  FAILURE_DEV_NOT_CONFIGURED = 7;
}
message ResolveReply {
  oneof outcome {
    ResolveResult result = 1;
    Failure failure = 2;
  }
}
