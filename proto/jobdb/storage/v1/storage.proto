edition = "2024";

package jobdb.storage.v1;

option go_package = "github.com/colony-2/jobdb/pkg/internal/storagepb/v1;storagepb";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message ChapterRecord {
  int64 ordinal = 1;
  string task_type = 2;
  string worker_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  string input_hash = 7;
  Metadata metadata = 8;
  ApplicationInputBytes input = 9;
  int32 attempt = 10;
  int32 max_attempts = 11;
  google.protobuf.Timestamp next_attempt_at = 12;
  int64 backoff_millis = 13;
  bool retryable = 14;
  InputReference input_ref = 15;
  RunPolicy run_policy = 16;
  repeated JobPrerequisite prerequisites = 17;
  string initial_payload_digest = 18;
  repeated ExecutionRecord reconstruction = 19;
  uint32 format_version = 20;

  oneof chapter {
    JobStartChapter job_start = 30;
    JobAttemptOutcomeChapter job_attempt_outcome = 31;
    TaskAttemptOutcomeChapter task_attempt_outcome = 32;
    RestartExtraChapter restart_extra = 33;
    ExecutionChapter execution = 34;
  }
}

message JobStartChapter {
  ApplicationInputBytes input = 1;
}

message JobAttemptOutcomeChapter {
  TaskOutcome outcome = 1;
}

message TaskAttemptOutcomeChapter {
  TaskOutcome outcome = 1;
}

message RestartExtraChapter {
  ApplicationOutputBytes output = 1;
}

message TaskOutcome {
  oneof result {
    ApplicationOutputBytes app_output = 1;
    AppErrorPayload app_error = 2;
    SystemErrorPayload system_error = 3;
    TimeoutPayload timeout = 4;
  }
}

message ApplicationInputBytes {
  bytes data = 1;
}

message ApplicationOutputBytes {
  bytes data = 1;
}

message Metadata {
  map<string, MetadataValue> fields = 1;
}

message MetadataValue {
  oneof kind {
    bool bool_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    string string_value = 4;
    MetadataList list_value = 5;
    MetadataMap map_value = 6;
    bool null_value = 7;
  }
}

message MetadataList {
  repeated MetadataValue values = 1;
}

message MetadataMap {
  map<string, MetadataValue> fields = 1;
}

message AppErrorPayload {
  string message = 1;
  string level = 2;
  map<string, MetadataValue> attrs = 3;
  InputReference input_ref = 4;
  repeated string stacktrace = 5;
}

message SystemErrorPayload {
  string message = 1;
  string component = 2;
  string code = 3;
  bool retryable = 4;
  InputReference input_ref = 5;
  repeated string stacktrace = 6;
}

message TimeoutPayload {
  string kind = 1;
  google.protobuf.Duration after = 2;
  string scope = 3;
  InputReference input_ref = 4;
  bool retryable = 5;
  string component = 6;
  string code = 7;
  string message = 8;
}

message InputReference {
  int64 ordinal = 1;
  string hash = 2;
}

message RetryPolicy {
  google.protobuf.Duration initial_interval = 1;
  double backoff_coefficient = 2;
  google.protobuf.Duration maximum_interval = 3;
  int32 maximum_attempts = 4;
  repeated string non_retryable_error_types = 5;
}

message RunPolicy {
  RetryPolicy retry = 1;
  google.protobuf.Duration invocation_timeout = 2;
  google.protobuf.Duration total_timeout = 3;
}

message JobPrerequisite {
  string job_id = 1;
  string condition = 2;
}

message SchedulerPayload {
  RunPolicy run_policy = 1;
  TaskWait task_wait = 2;
}

message TaskWait {
  int64 input_step = 1;
  int64 output_step = 2;
  string next = 3;
  string input_hash = 4;
}

message WaitForJobs {
  repeated string job_ids = 1;
}

// Versioned execution-pattern record, encoded by the strict execution codec.
message ExecutionChapter {
  reserved 1;
  reserved record_json;
  ExecutionRecord record = 2;
}

// Lossless typed values for extensible execution descriptors. Numeric lexemes
// preserve integer precision; application snapshots remain opaque bytes.
message ExecutionValue {
  oneof value {
    bool null_value = 1;
    bool bool_value = 2;
    string number_value = 3;
    string string_value = 4;
    ExecutionObject object_value = 5;
    ExecutionArray array_value = 6;
  }
}
message ExecutionObject { map<string, ExecutionValue> fields = 1; }
message ExecutionArray { repeated ExecutionValue items = 1; }
message ExecutionArtifact {
  string name = 1;
  string job_id = 2;
  int64 ordinal = 3;
  string stored_name = 4;
  int64 size_bytes = 5;
}
message ExecutionSnapshot {
  bytes data = 1;
  repeated ExecutionArtifact artifacts = 2;
}
message ExecutionVersions {
  uint32 execution_pattern_version = 1;
  string jobdb_version = 2;
  map<string,string> consumer_versions = 3;
}
message ExecutionRecord {
  uint32 version = 1;
  string kind = 2;
  string id = 3;
  string activation = 4;
  ExecutionVersions versions = 5;
  google.protobuf.Timestamp at = 6;
  ExecutionValue descriptor = 7;
  int32 attempt = 8;
  google.protobuf.Timestamp deadline = 9;
  google.protobuf.Timestamp total_deadline = 10;
  ExecutionSnapshot input = 11;
  ExecutionSnapshot output = 12;
  TaskOutcome error = 13;
  string rule = 14;
  string disposition = 15;
  bool retryable = 16;
  bool retry = 17;
  google.protobuf.Timestamp wake_at = 18;
  string source_tenant = 19;
  string source_job = 20;
  bytes application_payload = 21;
  ExecutionValue dependencies = 22;
  repeated JobPrerequisite prerequisites = 23;
  google.protobuf.Timestamp alternate_at = 24;
  string execution_task_type = 25;
  repeated ExecutionRecord retained = 26;
  ExecutionValue lifecycle_payload = 27;
}
