id: jobdb-build-verify
version: 1.0.0
desc: Validate the candidate on this worker with independently recorded CI checks.
inputs:
  api_version: ${{ inputs.api_version }}
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
state:
  initial: check_environment
  states:
    check_environment:
      id: check_environment
      op: command_execution
      inputs:
        shell: bash
        working_directory: ${{ context.environment.op.worktree_path }}
        timeout: 2m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          OUTBOX: ${{ context.environment.op.outbox }}
          API_VERSION: ${{ inputs.api_version }}
          CANDIDATE: ${{ inputs.candidate }}
          BASE: ${{ inputs.base }}
          GOOS: linux
          CGO_ENABLED: "1"
          CC: gcc
          GOWORK: "off"
        run: |
          set -eu
          exec > "$OUTBOX/environment.log" 2>&1
          printf 'Candidate: %s\nBase: %s\n' "$CANDIDATE" "$BASE"
          printf 'Observed HEAD: '; git rev-parse HEAD
          uname -s -m
          test "$API_VERSION" = c2.build-hook/v1
          case "$(uname -s -m)" in
            'Linux x86_64') native_arch=amd64 ;;
            'Linux aarch64') native_arch=arm64 ;;
            *) printf 'Unsupported verification platform: %s (requires native Linux amd64 or arm64)\n' "$(uname -s -m)"; exit 1 ;;
          esac
          for tool in bash git go gcc python3 mktemp; do command -v "$tool"; done
          GOARCH=$(go env GOHOSTARCH)
          export GOARCH
          if [ "$GOARCH" != "$native_arch" ]; then
            printf 'Go host architecture %s does not match worker architecture %s\n' "$GOARCH" "$native_arch"
            exit 1
          fi
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version | head -n 1
          python3 --version
          bash --version | head -n 1
          git --version
          test "$(go env CGO_ENABLED)" = 1
          case "$(go env GOVERSION)" in go1.26.*) ;; *) echo 'Requires pinned Go 1.26 toolchain'; exit 1 ;; esac
          printf 'CI specifies Go 1.26.1; native package pins compatible Go 1.26.8.\n'
          printf 'Held: alternate OS/architecture matrices, tagging, signing, releases and publication.\n'
          printf 'Embedded PostgreSQL: isolated local child processes; root drops to nobody.\n'
      catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: ${{ failure.kind == 'timeout' }}
              failure: ${{ failure }}
              error_message: ${{ failure.message }}
              stdout: ""
      transitions:
        - to: test_integration
          when: jq(states.check_environment.outputs, '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true
        - to: summarize
      const: true
      execution_needs:
        packages:
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#bash
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#coreutils
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#git
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#go_1_26
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#gcc
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#python3
    test_integration:
      id: test_integration
      op: command_execution
      inputs:
        shell: bash
        working_directory: ${{ context.environment.op.worktree_path }}
        timeout: 30m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          OUTBOX: ${{ context.environment.op.outbox }}
          GOOS: linux
          CGO_ENABLED: "1"
          CC: gcc
          GOWORK: "off"
        run: |
          set -eu
          exec > "$OUTBOX/tests.log" 2>&1
          GOARCH=$(go env GOHOSTARCH)
          export GOARCH
          printf 'Native Go target: %s/%s\n' "$GOOS" "$GOARCH"
          scratch=$(mktemp -d /tmp/jobdb-verify.XXXXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          # Embedded PG test binaries drop root; only scratch ancestors need traversal.
          chmod 755 "$scratch"
          export TMPDIR="$scratch/tmp" GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod"
          export GOPATH="$scratch/go" XDG_CACHE_HOME="$scratch/cache"
          mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$XDG_CACHE_HOME"
          chmod 755 "$TMPDIR"
          for variable in ${!C2J_CURRENT_@} ${!C2J_CHILD_JOB_@} ${!C2J_WORKSPACE_@}; do unset "$variable"; done
          unset C2J_TENANT_ID C2J_OBJECT_OUTBOX JOBDB_EXTERNAL_REMOTE_BASE_URL JOBDB_EXTERNAL_REMOTE_NAME JOBDB_EXTERNAL_REMOTE_ONLY JOBDB_CHAPTER_POSTGRES_DSN
          # Scoped Git transport credentials remain available for module downloads.
          # Check receipt acceptance before the candidate can be published.
          printf '%s\n' 'Command: python3 -B -m unittest discover -s scripts -p test_verify_published_module.py -v'
          python3 -B -m unittest discover -s scripts -p 'test_verify_published_module.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_check_resource_tests.py' -v
          test -s scripts/test_check_published_goals.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_check_published_goals.py' -v
          # Check the installed format and all supported offline migration paths
          # before the long integration/race sweeps.
          printf '%s\n' "Command: go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/cli -run '^(TestProjectInitializeAndInspectCLI|TestSQLiteCheckMigrate.*|TestSQLiteMigrate.*)$'"
          go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/cli -run '^(TestProjectInitializeAndInspectCLI|TestSQLiteCheckMigrate.*|TestSQLiteMigrate.*)$'
          # testdata is excluded from ./...; run the exact public consumer fixture too.
          printf '%s\n' 'Command: go test -count=1 -timeout=5m ./scripts/testdata/published-append-consumer'
          go test -count=1 -timeout=5m ./scripts/testdata/published-append-consumer
          # Keep retained authorization and the separately compiled old client gated.
          test -s pkg/jobdb/runtime/remote/retained_read_permission_test.go
          printf '%s\n' "Command: go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/runtime/remote -run '^TestRetainedRead'"
          go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/runtime/remote -run '^TestRetainedRead'
          test -s scripts/testdata/retained-read-compatibility/main_test.go
          printf '%s\n' 'Command: go test -count=1 -timeout=8m -v ./scripts/testdata/retained-read-compatibility'
          go test -count=1 -timeout=8m -v ./scripts/testdata/retained-read-compatibility
          # Resource acceptance must select real tests on both backends and the
          # explicit external consumer (testdata is excluded from ./...).
          printf '%s\n' 'Command: go test -json -count=1 -timeout=5m -run TestResourceBackoff|TestRetainedRead <resource packages and public consumer>'
          go test -json -count=1 -timeout=5m -run 'TestResourceBackoff|TestRetainedRead' ./pkg/workflow ./pkg/jobdb ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/toy/... ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtimetest ./scripts/testdata/resource-backoff-consumer > "$scratch/resource-tests.jsonl"
          cat "$scratch/resource-tests.jsonl"
          python3 scripts/check-resource-tests.py "$scratch/resource-tests.jsonl"
          # Check both route inventories and public signatures before exercising them.
          sha256sum pkg/jobdb/internal/runtimeapi/zz{,_consumer}_generated.go pkg/jobdb/internal/projectapi/zz_generated.go pkg/jobdb/internal/projectwire/zz_shapes.go pkg/jobdb/runtime/remote/zz_project_routes.go > "$scratch/generated.sha256"
          go generate ./pkg/jobdb/internal/runtimeapi ./pkg/jobdb/internal/projectapi ./pkg/jobdb/runtime/remote
          sha256sum -c "$scratch/generated.sha256"
          go run ./cmd/jobdb-api-snapshot -packages api/packages.txt -check api/jobdb.public.txt
          printf '%s\n' "Command: go test -count=1 -p=2 -timeout=5m -v -tags=integration ./pkg/jobdb/jobid ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtime/toy/... ./pkg/workflow -run '^(TestJobID.*|TestAppend.*|TestStartOrAppendConformance|TestGoalMigrationConvertsPreservingRetainedState|TestMigratedSQLiteFailureHTTPInspection)$'"
          go test -count=1 -p=2 -timeout=5m -v -tags=integration ./pkg/jobdb/jobid ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtime/toy/... ./pkg/workflow -run '^(TestJobID.*|TestAppend.*|TestStartOrAppendConformance|TestGoalMigrationConvertsPreservingRetainedState|TestMigratedSQLiteFailureHTTPInspection)$'
          # Check typed permission errors on both generated project append clients.
          test -s pkg/jobdb/internal/projectapi/append_test.go
          printf '%s\n' "Command: go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/internal/projectapi -run '^TestProjectAppendPermissionDeniedResponses$'"
          go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/internal/projectapi -run '^TestProjectAppendPermissionDeniedResponses$'
          # Protect terminal record meaning at the actual public CLI boundary.
          test -s pkg/jobdb/cli/goal_candidates_test.go
          printf '%s\n' "Command: go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/cli -run '^TestGoalCandidatesPreservesTerminalFailure$'"
          go test -count=1 -p=1 -timeout=3m -v ./pkg/jobdb/cli -run '^TestGoalCandidatesPreservesTerminalFailure$'
          # The complete HTTP transport matrix can exceed Go's 10m default.
          printf '%s\n' 'Command: go test -count=1 -p=2 -timeout=20m -v -tags=integration -exec <python3 absolute-native-launcher> ./...'
          go test -count=1 -p=2 -timeout=20m -v -tags=integration -exec "python3 $PWD/scripts/verify-test-exec.py" ./...
          # Recovered goal semantics and the actual current-upstream migration fixture.
          printf '%s\n' "Command: go test -count=1 -p=2 -timeout=8m -v ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtime/toy/... ./pkg/jobdb/cli ./pkg/workflow -run 'Test.*Goal|Test.*Terminal|TestSQLiteMigrate|TestSubmissionAvailability|TestRestartPublicationFailure'"
          go test -count=1 -p=2 -timeout=8m -v ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtime/toy/... ./pkg/jobdb/cli ./pkg/workflow -run 'Test.*Goal|Test.*Terminal|TestSQLiteMigrate|TestSubmissionAvailability|TestRestartPublicationFailure'
          # Exercise live status, real expiry and same-job recovery repeatedly.
          printf '%s\n' "Command: go test -count=3 -p=1 -timeout=5m -v -tags=integration ./pkg/workflow/internal/jobdbtest/runtimeconformance -run '^(TestBuiltInRuntimeConformance|TestRemoteRuntimeConformance)$/^crash_concern_excludes_ready_work$'"
          go test -count=3 -p=1 -timeout=5m -v -tags=integration ./pkg/workflow/internal/jobdbtest/runtimeconformance -run '^(TestBuiltInRuntimeConformance|TestRemoteRuntimeConformance)$/^crash_concern_excludes_ready_work$'
      catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: ${{ failure.kind == 'timeout' }}
              failure: ${{ failure }}
              error_message: ${{ failure.message }}
              stdout: ""
      transitions:
        - to: test_races
      const: true
      execution_needs:
        packages:
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#bash
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#coreutils
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#git
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#go_1_26
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#gcc
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#python3
    summarize:
      id: summarize
      op: command_execution
      artifacts:
        ./: '${{ jq([(has(states.check_environment) ? states.check_environment.artifacts : {}), (has(states.test_integration) ? states.test_integration.artifacts : {}), (has(states.test_races) ? states.test_races.artifacts : {})], ''add | with_entries(select(.key == "environment.log" or .key == "tests.log" or .key == "races.log"))'') }}'
      inputs:
        shell: bash
        working_directory: ${{ context.environment.op.worktree_path }}
        timeout: 2m
        capture_diagnostics: always
        env:
          INBOX: ${{ context.environment.op.inbox }}
          OUTBOX: ${{ context.environment.op.outbox }}
          CANDIDATE: ${{ inputs.candidate }}
          BASE: ${{ inputs.base }}
          VERDICT: '${{ (inputs.api_version == ''c2.build-hook/v1'' && jq((has(states.check_environment) ? states.check_environment.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true && ''environment.log'' in (has(states.check_environment) ? states.check_environment.artifacts : {}) && jq((has(states.test_integration) ? states.test_integration.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true && ''tests.log'' in (has(states.test_integration) ? states.test_integration.artifacts : {}) && jq((has(states.test_races) ? states.test_races.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true && ''races.log'' in (has(states.test_races) ? states.test_races.artifacts : {})) ? ''passed'' : ''failed'' }}'
          RESULT_0: '${{ (jq((has(states.check_environment) ? states.check_environment.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true) ? ''passed'' : ''failed'' }}'
          DETAIL_0: '${{ json_stringify((has(states.check_environment) ? states.check_environment.outputs : {})) }}'
          RESULT_1: '${{ !(jq((has(states.check_environment) ? states.check_environment.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true) ? ''not run (environment gate failed)'' : (jq((has(states.test_integration) ? states.test_integration.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true) ? ''passed'' : ''failed'' }}'
          DETAIL_1: '${{ json_stringify((has(states.test_integration) ? states.test_integration.outputs : {})) }}'
          RESULT_2: '${{ !(jq((has(states.check_environment) ? states.check_environment.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true) ? ''not run (environment gate failed)'' : (jq((has(states.test_races) ? states.test_races.outputs : {}), ''.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)'') == true) ? ''passed'' : ''failed'' }}'
          DETAIL_2: '${{ json_stringify((has(states.test_races) ? states.test_races.outputs : {})) }}'
        run: |
          set -eu
          report="$OUTBOX/summary.md"
          missing=0
          {
            printf '# JobDB local verification: %s\n\nCandidate: %s\nBase: %s\n' "$VERDICT" "$CANDIDATE" "$BASE"
            printf '\nNative Linux worker checks only; does not certify the GitHub matrix or publication.\n'
            printf '\n## check_environment: %s\n\n```json\n%s\n```\n' "$RESULT_0" "$DETAIL_0"
            if [ -s "$INBOX/environment.log" ]; then
              printf 'Evidence: environment.log\n'
            else
              printf 'Evidence unavailable: environment.log\n'; missing=1
            fi
            printf '\n## test_integration: %s\n\n```json\n%s\n```\n' "$RESULT_1" "$DETAIL_1"
            if [ -s "$INBOX/tests.log" ]; then
              printf 'Evidence: tests.log\n'
            elif [ "$RESULT_1" = 'not run (environment gate failed)' ]; then
              printf 'No tests.log: integration did not run.\n'
            else
              printf 'Evidence unavailable: tests.log\n'; missing=1
            fi
            printf '\n## test_races: %s\n\n```json\n%s\n```\n' "$RESULT_2" "$DETAIL_2"
            if [ -s "$INBOX/races.log" ]; then
              printf 'Evidence: races.log\n'
            elif [ "$RESULT_2" = 'not run (environment gate failed)' ]; then
              printf 'No races.log: race checks did not run.\n'
            else
              printf 'Evidence unavailable: races.log\n'; missing=1
            fi
            printf '\n## Environment\n\n'
            if [ -s "$INBOX/environment.log" ]; then cat "$INBOX/environment.log"; fi
            printf '\n## Observed skip markers (not additional coverage)\n\n'
            for log in tests.log races.log; do
              if [ -f "$INBOX/$log" ]; then grep -E -- '--- SKIP:|SKIP|[Ss]kipping' "$INBOX/$log" || true; fi
            done
          } > "$report"
          test -s "$report"
          test "$missing" = 0
          printf 'JobDB local verification %s; environment=%s, integration=%s, races=%s. See summary.md and per-task logs.' "$VERDICT" "$RESULT_0" "$RESULT_1" "$RESULT_2"
      catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: ${{ failure.kind == 'timeout' }}
              failure: ${{ failure }}
              error_message: ${{ failure.message }}
              stdout: ""
      const: true
      execution_needs:
        packages:
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#bash
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#coreutils
          - nix:github:NixOS/nixpkgs/a033e66ab94a6bedf2c3d58d93a36319d3cbbbaf#gnugrep
    test_races:
      id: test_races
      op: command_execution
      inputs:
        shell: bash
        working_directory: ${{ context.environment.op.worktree_path }}
        timeout: 90m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          OUTBOX: ${{ context.environment.op.outbox }}
          GOOS: linux
          CGO_ENABLED: "1"
          CC: gcc
          GOWORK: "off"
          GOMAXPROCS: "2"
        run: |
          set -eu
          exec > "$OUTBOX/races.log" 2>&1
          GOARCH=$(go env GOHOSTARCH)
          export GOARCH
          printf 'Native Go target: %s/%s\n' "$GOOS" "$GOARCH"
          scratch=$(mktemp -d /tmp/jobdb-verify.XXXXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          # Embedded PG test binaries drop root; only scratch ancestors need traversal.
          chmod 755 "$scratch"
          export TMPDIR="$scratch/tmp" GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod"
          export GOPATH="$scratch/go" XDG_CACHE_HOME="$scratch/cache"
          mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$XDG_CACHE_HOME"
          chmod 755 "$TMPDIR"
          for variable in ${!C2J_CURRENT_@} ${!C2J_CHILD_JOB_@} ${!C2J_WORKSPACE_@}; do unset "$variable"; done
          unset C2J_TENANT_ID C2J_OBJECT_OUTBOX JOBDB_EXTERNAL_REMOTE_BASE_URL JOBDB_EXTERNAL_REMOTE_NAME JOBDB_EXTERNAL_REMOTE_ONLY JOBDB_CHAPTER_POSTGRES_DSN
          # Scoped Git transport credentials remain available for module downloads.
          # Bound Go tool and test runtime threads independently of package parallelism.
          printf 'Go runtime parallelism: %s\n' "$GOMAXPROCS"
          # Check route eligibility and the exact injected-clock boundary before
          # the long sweep; retain every route/claim assertion in the matrix.
          printf '%s\n' "Command: go test -json -race -count=3 -p=1 -parallel=2 -timeout=5m ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtime/sqlite -run '^(TestAvailableRoutesConformance|TestResourceBackoffAvailabilityClockBoundaryB09b)$'"
          time go test -json -race -count=3 -p=1 -parallel=2 -timeout=5m ./pkg/jobdb/runtime/remote ./pkg/jobdb/runtime/sqlite -run '^(TestAvailableRoutesConformance|TestResourceBackoffAvailabilityClockBoundaryB09b)$'
          # Keep full resource eligibility separate from deadline-only recovery,
          # including zero-credit crash recovery and actual no-body timeout execution.
          printf '%s\n' "Command: go test -json -race -count=3 -p=1 -parallel=2 -timeout=5m ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/toy/... -run '^TestResourceBackoffConformance$/(B09b_deadline_keeps_resource_gate|B11a_zero_credit_deadline_|B11_zero_credit_engine_timeout)'"
          time go test -json -race -count=3 -p=1 -parallel=2 -timeout=5m ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/toy/... -run '^TestResourceBackoffConformance$/(B09b_deadline_keeps_resource_gate|B11a_zero_credit_deadline_|B11_zero_credit_engine_timeout)'
          # -p bounds packages; separately bound t.Parallel fixtures under race overhead.
          # Preserve the availability matrix's future window and every assertion.
          # The complete race-instrumented workflow package exceeds Go's 10m default.
          # Observed workflow and remote suites alone take over 31m; SQLite and
          # cold compilation also run serially. Budget the aggregate separately
          # from package deadlines. HTTP took 18.6m before the longer fixture waits;
          # allow 25m for the initial sweep and record elapsed stage times.
          printf '%s\n' "Command: go test -count=1 -timeout=25m -p=1 -parallel=2 -v -race ./pkg/workflow ./pkg/jobdb/secrets/... ./pkg/jobdb/cli ./examples/secret-provider ./pkg/jobdb/runtime/remote ./pkg/jobdb ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/toy/... ./pkg/jobdb/runtimetest ./pkg/jobdb/projectcatalog ./pkg/jobdb/internal/projectwire ./pkg/jobdb/internal/projectapi"
          time go test -count=1 -timeout=25m -p=1 -parallel=2 -v -race ./pkg/workflow ./pkg/jobdb/secrets/... ./pkg/jobdb/cli ./examples/secret-provider ./pkg/jobdb/runtime/remote ./pkg/jobdb ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/toy/... ./pkg/jobdb/runtimetest ./pkg/jobdb/projectcatalog ./pkg/jobdb/internal/projectwire ./pkg/jobdb/internal/projectapi
          # Repeat real resource transition, immutable replay, countdown reclaim,
          # injected transaction/barrier, migration/reopen and HTTP authority cases.
          printf '%s\n' "Command: go test -json -race -count=3 -p=1 -timeout=10m -run TestResourceBackoff ./pkg/workflow ./pkg/jobdb/runtime/... ./pkg/jobdb/runtimetest"
          time go test -json -race -count=3 -p=1 -timeout=10m -run TestResourceBackoff ./pkg/workflow ./pkg/jobdb/runtime/... ./pkg/jobdb/runtimetest
          # Independent writers and both controlled closure/admission/wait commit orders.
          printf '%s\n' "Command: go test -count=3 -p=1 -timeout=10m -v -race ./pkg/jobdb/runtime/sqlite -run 'TestGoalPublic|TestGoalAdmissionPublic|TestSQLiteTerminalFailurePublic'"
          time go test -count=3 -p=1 -timeout=10m -v -race ./pkg/jobdb/runtime/sqlite -run 'TestGoalPublic|TestGoalAdmissionPublic|TestSQLiteTerminalFailurePublic'
          printf '%s\n' "Command: go test -count=1 -p=1 -timeout=20m -v -race ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/remote -run 'TestInfrastructure|TestProvenance|TestLegacyKeepAlive'"
          time go test -count=1 -p=1 -timeout=20m -v -race ./pkg/jobdb/runtime/core ./pkg/jobdb/runtime/sqlite ./pkg/jobdb/runtime/remote -run 'TestInfrastructure|TestProvenance|TestLegacyKeepAlive'
          # Repeat the accepted-prefix payload fixture that failed the broad sweep.
